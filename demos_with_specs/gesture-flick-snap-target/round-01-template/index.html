<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gesture Flick Snap Target</title>
    <style>
      :root {
        --page-top: #04152a;
        --page-bottom: #020914;
        --marker: rgba(196, 214, 255, 0.85);
        --rest: #4ec3ff;
        --card-top: #f8fbff;
        --card-bottom: #d9e8ff;
        --card-ink: #0d2446;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(34, 87, 153, 0.4), transparent 40%),
          linear-gradient(180deg, var(--page-top), var(--page-bottom));
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .corner-marker,
      .rest-marker,
      .pip-card {
        position: absolute;
        top: 0;
        left: 0;
      }

      .corner-marker {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--marker);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.16),
          0 0 18px rgba(125, 184, 255, 0.5);
      }

      .rest-marker {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--rest);
        box-shadow: 0 0 18px rgba(78, 195, 255, 0.75);
        opacity: 0;
      }

      .pip-card {
        width: 120px;
        height: 80px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--card-ink);
        background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="corner-marker" data-corner="topLeft"></div>
      <div class="corner-marker" data-corner="topRight"></div>
      <div class="corner-marker" data-corner="bottomLeft"></div>
      <div class="corner-marker" data-corner="bottomRight"></div>
      <div id="rest-marker" class="rest-marker"></div>
      <div id="pip-card" class="pip-card">PiP</div>
    </div>
    <script src="./index.ts" type="module"></script>
  </body>
</html>
