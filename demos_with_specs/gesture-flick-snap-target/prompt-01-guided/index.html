<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gesture Flick Snap Target</title>
  <style>
    :root {
      color-scheme: dark;
      --page-top: #08182f;
      --page-bottom: #030914;
      --card-fill: linear-gradient(180deg, #f3fbff 0%, #d5ebff 100%);
      --card-text: #14385b;
      --corner-fill: rgba(171, 205, 255, 0.38);
      --corner-stroke: rgba(198, 221, 255, 0.86);
      --rest-fill: #41b6ff;
      --rest-glow: rgba(65, 182, 255, 0.45);
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font: 600 24px/1.1 system-ui;
      background:
        radial-gradient(circle at 50% 18%, rgba(72, 122, 198, 0.3), transparent 34%),
        linear-gradient(180deg, var(--page-top) 0%, var(--page-bottom) 100%);
    }

    .corner-marker,
    .rest-marker,
    .pip-card {
      position: absolute;
      box-sizing: border-box;
      will-change: transform;
    }

    .corner-marker {
      border-radius: 999px;
      background: var(--corner-fill);
      border: 1px solid var(--corner-stroke);
      box-shadow: 0 0 24px rgba(180, 216, 255, 0.18);
    }

    .rest-marker {
      border-radius: 999px;
      background: var(--rest-fill);
      box-shadow: 0 0 20px var(--rest-glow);
    }

    .pip-card {
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: var(--card-fill);
      color: var(--card-text);
      letter-spacing: 0.04em;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.65);
      cursor: inherit;
    }
  </style>
</head>
<body>
  <script src="./index.ts" type="module"></script>
</body>
</html>
