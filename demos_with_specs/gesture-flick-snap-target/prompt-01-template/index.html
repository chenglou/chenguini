<!DOCTYPE html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gesture Flick Snap Target</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-deep: #04111f;
      --bg-glow: #12335a;
      --pip-top: #f7fbff;
      --pip-bottom: #c5d6ea;
      --pip-ink: #08203f;
      --corner-fill: rgba(219, 236, 255, 0.18);
      --corner-stroke: rgba(219, 236, 255, 0.6);
      --rest-fill: #47a5ff;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font: 600 16px/1.1 "Avenir Next", "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      background:
        radial-gradient(circle at 20% 20%, rgba(63, 123, 196, 0.28), transparent 0 28%),
        radial-gradient(circle at 80% 75%, rgba(53, 107, 177, 0.22), transparent 0 26%),
        linear-gradient(180deg, #07172a 0%, var(--bg-deep) 45%, #020912 100%);
      color: #dce8f9;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .corner-marker,
    .rest-marker,
    .pip-card {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
    }

    .corner-marker {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--corner-fill);
      box-shadow: 0 0 0 1px var(--corner-stroke), 0 0 24px rgba(94, 170, 255, 0.18);
      z-index: 1;
    }

    .rest-marker {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--rest-fill);
      box-shadow: 0 0 20px rgba(71, 165, 255, 0.6);
      opacity: 0;
      z-index: 2;
      pointer-events: none;
    }

    .pip-card {
      width: 120px;
      height: 80px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, var(--pip-top) 0%, var(--pip-bottom) 100%);
      color: var(--pip-ink);
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      touch-action: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="./index.ts" type="module"></script>
</body>
