<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Thin Repeat 01</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0)),
          linear-gradient(180deg, #f4efe9 0%, #d8e6ef 100%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .board {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: clip;
        touch-action: none;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        border-radius: 22px;
        padding: 18px 20px;
        color: rgba(24, 30, 36, 0.88);
        transform-origin: center center;
        cursor: grab;
        touch-action: none;
      }

      .card-title {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .card-body {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.4;
        max-width: 16rem;
      }

      .board-caption {
        position: absolute;
        left: 24px;
        bottom: 24px;
        max-width: 20rem;
        color: rgba(31, 43, 53, 0.72);
        font-size: 13px;
        line-height: 1.4;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
