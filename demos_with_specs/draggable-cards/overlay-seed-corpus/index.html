<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draggable Cards Overlay Seed Corpus</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: linear-gradient(180deg, #101624 0%, #0b0f18 55%, #090c12 100%);
        --card-border: rgba(255, 255, 255, 0.12);
        --card-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        --text: rgba(255, 255, 255, 0.9);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--page-bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body::before {
        content: '';
        position: fixed;
        inset: -20vh -10vw auto;
        height: 50vh;
        background:
          radial-gradient(circle at 20% 30%, rgba(112, 181, 255, 0.24), transparent 40%),
          radial-gradient(circle at 80% 0%, rgba(255, 171, 76, 0.18), transparent 36%);
        pointer-events: none;
        filter: blur(24px);
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }

      .chrome {
        position: fixed;
        left: 24px;
        top: 18px;
        z-index: 1;
        display: grid;
        gap: 6px;
        pointer-events: none;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.52);
      }

      .title {
        font-size: 18px;
        font-weight: 650;
      }

      .stack {
        position: absolute;
        inset: 0;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        border-radius: 24px;
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 18px 20px;
        box-sizing: border-box;
        user-select: none;
        touch-action: none;
        will-change: transform;
      }

      .card-body {
        display: grid;
        gap: 4px;
      }

      .card-id {
        font-size: 18px;
        font-weight: 700;
      }

      .card-size {
        font-size: 12px;
        opacity: 0.7;
      }

      .card-pill {
        align-self: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      #report {
        display: none;
      }
    </style>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <script id="report" type="application/json"></script>
  </body>
</html>
