<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Round 03</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e4e6eb;
      }

      body {
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        border: 1px solid transparent;
        color: white;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 1px rgb(0 0 0 / 0.12);
        box-sizing: border-box;
        transform-origin: center center;
      }

      #semantic-report {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <pre id="semantic-report"></pre>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
