<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Round 01</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        background: linear-gradient(180deg, hsl(220 14% 92%), hsl(220 18% 88%));
        font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
        isolation: isolate;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        border-radius: 20px;
        border-style: solid;
        border-width: 1px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.01em;
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
