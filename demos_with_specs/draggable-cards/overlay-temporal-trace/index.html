<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Overlay: Temporal Trace Tape</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-a: #10131b;
        --bg-b: #151d2b;
        --panel: rgba(11, 16, 27, 0.76);
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(245, 247, 255, 0.94);
        --muted: rgba(245, 247, 255, 0.68);
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.34);
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font: 14px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(90, 115, 255, 0.2), transparent 40%),
          radial-gradient(circle at 20% 20%, rgba(255, 150, 90, 0.1), transparent 30%),
          linear-gradient(180deg, var(--bg-a), var(--bg-b));
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .copy {
        position: absolute;
        left: 32px;
        top: 28px;
        max-width: 480px;
        z-index: 1;
        padding: 18px 20px 16px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .copy h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: -0.03em;
      }

      .copy p {
        margin: 0;
        color: var(--muted);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: rgba(255, 255, 255, 0.5);
      }

      .stack {
        position: absolute;
        inset: 0;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-sizing: border-box;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
        transform-origin: top left;
        user-select: none;
        touch-action: none;
        will-change: transform, opacity, box-shadow;
        transition: box-shadow 120ms linear, opacity 120ms linear;
      }

      .card[data-state="dragging"] {
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.34);
      }

      .card__inner {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px 18px 16px;
        box-sizing: border-box;
      }

      .card__label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .card__label span:last-child {
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
        color: rgba(255, 255, 255, 0.72);
      }

      .card__body {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      .card__meta {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.72);
      }
    </style>
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <main class="scene">
      <section class="copy">
        <p class="eyebrow">Temporal trace tape</p>
        <h1>Draggable cards</h1>
        <p>Drag card 1 downward. The reorder should happen before release, and the released card should stay on top until it settles.</p>
      </section>
      <div class="stack" id="stack"></div>
    </main>
  </body>
</html>
