<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Round 09</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, rgb(236, 239, 243), rgb(224, 228, 234));
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .card {
        position: absolute;
        width: 320px;
        box-sizing: border-box;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.96);
        touch-action: none;
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
