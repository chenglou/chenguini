<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Round 06</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, #edf2f8 0%, #e3e9f2 100%);
        touch-action: none;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        border: 1px solid transparent;
        color: rgba(255, 255, 255, 0.96);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
        transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
