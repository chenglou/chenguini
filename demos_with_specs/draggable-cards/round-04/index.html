<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Round 04</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgb(236, 239, 243);
      }

      body {
        user-select: none;
        -webkit-user-select: none;
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        touch-action: none;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        border-radius: 18px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.96);
        font-size: 28px;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 2px rgba(15, 31, 56, 0.18);
        transform-origin: 50% 50%;
        will-change: auto;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
