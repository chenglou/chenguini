<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Draggable Cards Round 02</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        position: relative;
        overflow: hidden;
        background: hsl(210 12% 92%);
        user-select: none;
        -webkit-user-select: none;
        font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
        isolation: isolate;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
        width: 320px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: hsl(0 0% 100% / 0.94);
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 1px hsl(210 35% 24% / 0.18);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
