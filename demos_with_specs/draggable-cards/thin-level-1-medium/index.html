<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 35%),
          linear-gradient(180deg, #fff8ef 0%, #f6efe6 52%, #efe5d8 100%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        color: #402917;
      }

      #app {
        position: relative;
        min-height: 100vh;
        isolation: isolate;
        overflow: hidden;
      }

      .card {
        position: absolute;
        left: 0;
        width: 320px;
        border-radius: 28px;
        padding: 22px 24px;
        box-shadow:
          0 18px 30px rgba(70, 36, 11, 0.12),
          0 6px 12px rgba(70, 36, 11, 0.08);
        touch-action: none;
        cursor: grab;
      }

      .card__eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.68;
      }

      .card__title {
        margin-top: 12px;
        font-size: 26px;
        font-weight: 600;
        line-height: 1.05;
      }

      .card__body {
        margin-top: 12px;
        max-width: 180px;
        font-size: 14px;
        line-height: 1.35;
        opacity: 0.84;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
