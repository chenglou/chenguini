<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Cards Round 11 Compressed</title>
    <style>
      :root {
        color: #0f172a;
        background: #ededed;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        background: #ededed;
        overflow-x: hidden;
      }

      #app {
        position: relative;
        min-height: 100vh;
      }

      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        border: 0;
        border-radius: 18px;
        color: white;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow:
          0 18px 32px rgba(15, 23, 42, 0.12),
          0 6px 10px rgba(15, 23, 42, 0.08);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        will-change: transform, opacity;
      }

      .card:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
