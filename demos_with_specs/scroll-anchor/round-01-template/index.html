<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<body>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(74, 144, 226, 0.16), transparent 28%),
        linear-gradient(180deg, #10151f 0%, #0b0f17 100%);
      color: #e7edf5;
      font-family: "SFMono-Regular", "Menlo", "Monaco", monospace;
    }
    button {
      border: 1px solid #37465f;
      border-radius: 10px;
      background: rgba(20, 28, 41, 0.96);
      color: inherit;
      font: inherit;
      padding: 10px 14px;
      cursor: pointer;
    }
    button:hover {
      background: rgba(33, 45, 66, 0.96);
    }
    .app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
      padding: 20px;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .scroller-shell {
      position: relative;
      width: min(840px, 100%);
      height: 540px;
      border: 1px solid rgba(126, 152, 196, 0.35);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(9, 13, 21, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .scroller {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }
    .content {
      position: relative;
      width: 100%;
    }
    .reference-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px dashed rgba(255, 255, 255, 0.55);
      pointer-events: none;
      z-index: 3;
    }
    .reference-line-label {
      position: absolute;
      right: 12px;
      top: calc(50% - 11px);
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #d8e3f3;
      font-size: 11px;
      pointer-events: none;
      z-index: 3;
    }
    .header {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 24px;
      color: #8f9db2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      z-index: 2;
    }
    .item {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 100px;
      border-radius: 16px;
      padding: 16px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      z-index: 1;
    }
    .item-id {
      font-size: 14px;
      font-weight: 700;
    }
    .item-label {
      font-size: 12px;
      opacity: 0.88;
    }
    .info {
      width: min(840px, 100%);
      min-height: 42px;
      padding: 12px 14px;
      border: 1px solid rgba(126, 152, 196, 0.26);
      border-radius: 12px;
      background: rgba(13, 18, 27, 0.84);
      color: #c1cddd;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
  <script type="module" src="./index.ts"></script>
</body>
