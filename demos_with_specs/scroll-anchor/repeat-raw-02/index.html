<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Anchor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1116;
        --panel: #151922;
        --panel-border: #273042;
        --text: #e7ecf5;
        --muted: #97a1b3;
        --line: rgba(255, 255, 255, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(41, 128, 185, 0.18), transparent 30%),
          radial-gradient(circle at top right, rgba(39, 174, 96, 0.14), transparent 26%),
          var(--bg);
        color: var(--text);
        font:
          14px/1.4 SFMono-Regular,
          ui-monospace,
          Menlo,
          Monaco,
          Consolas,
          Liberation Mono,
          monospace;
      }

      .app {
        width: min(960px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 16px 0 20px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }

      button {
        appearance: none;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font: inherit;
        padding: 10px 14px;
        cursor: pointer;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .scroll-shell {
        position: relative;
        border: 1px solid var(--panel-border);
        background: color-mix(in srgb, var(--panel) 88%, black);
      }

      .scroller {
        position: relative;
        height: 520px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .content {
        position: relative;
      }

      .reference-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: var(--line);
        pointer-events: none;
      }

      .header,
      .item {
        position: absolute;
        left: 20px;
        right: 20px;
      }

      .header {
        height: 24px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .item {
        height: 100px;
        padding: 14px 16px;
        color: white;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      .item-id {
        opacity: 0.88;
      }

      .item-label {
        font-size: 18px;
      }

      .info {
        margin-top: 12px;
        color: var(--muted);
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="controls">
        <button id="scroll-700" type="button">Scroll to 700</button>
        <button id="add-three" type="button">Add 3 above</button>
        <button id="add-rapid" type="button">Add 1, then 2 rapid</button>
      </div>
      <div class="scroll-shell">
        <div id="scroller" class="scroller">
          <div id="content" class="content"></div>
        </div>
        <div class="reference-line"></div>
      </div>
      <div id="info" class="info"></div>
    </main>
    <script type="module" src="./page.js"></script>
  </body>
</html>
