<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<body>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171b20;
      --panel-border: #2a3038;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: rgba(255, 255, 255, 0.22);
      --reference: rgba(255, 244, 143, 0.9);
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(74, 88, 112, 0.25), transparent 40%),
        linear-gradient(180deg, #11161b 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      padding: 24px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }
  </style>
  <script type="module" src="./index.ts"></script>
</body>
