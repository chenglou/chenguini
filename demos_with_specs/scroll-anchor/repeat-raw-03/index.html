<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Scroll Anchor</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #0b0f14;
        --panel-bg: #121923;
        --panel-border: #263241;
        --text: #dfe8f2;
        --muted: #8a97a6;
        --accent: #5dade2;
        --reference: rgba(255, 255, 255, 0.45);
        --header-bg: #0f1620;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #182231 0%, var(--page-bg) 58%);
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }

      body {
        padding: 24px;
      }

      .page {
        margin: 0 auto;
        max-width: 920px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }

      button {
        border: 1px solid var(--panel-border);
        background: linear-gradient(180deg, #18222f 0%, #121923 100%);
        color: var(--text);
        font: inherit;
        padding: 10px 14px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .viewport-shell {
        position: relative;
        border: 1px solid var(--panel-border);
        background: linear-gradient(180deg, #0f141c 0%, var(--panel-bg) 100%);
        height: 560px;
        overflow: clip;
      }

      .scroll-container {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-color: #445569 transparent;
      }

      .content {
        position: relative;
        min-height: 100%;
      }

      .reference-line {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        border-top: 1px dashed var(--reference);
        pointer-events: none;
      }

      .header {
        position: absolute;
        left: 16px;
        right: 16px;
        height: 24px;
        padding: 4px 8px;
        color: var(--muted);
        background: linear-gradient(90deg, var(--header-bg), transparent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 12px;
      }

      .item {
        position: absolute;
        left: 16px;
        right: 16px;
        height: 100px;
        display: flex;
        align-items: center;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: white;
        font-size: 22px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .info {
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .info strong {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="controls">
        <button type="button" id="scroll-to-700">Scroll to 700</button>
        <button type="button" id="add-3-above">Add 3 above</button>
        <button type="button" id="add-rapid">Add 1, then 2 rapid</button>
      </div>

      <section class="viewport-shell">
        <div class="scroll-container" id="scroll-container">
          <div class="content" id="content"></div>
        </div>
        <div class="reference-line"></div>
      </section>

      <div class="info" id="info"></div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
