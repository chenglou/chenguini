<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Anchor Round 01 Raw</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --bg-panel: #161a22;
        --bg-card: #1f2430;
        --border: #30384a;
        --text: #eef2ff;
        --muted: #97a3b6;
        --reference: #f7dc6f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(41, 128, 185, 0.22), transparent 32%),
          radial-gradient(circle at bottom right, rgba(192, 57, 43, 0.18), transparent 28%),
          var(--bg);
        color: var(--text);
        font:
          15px/1.4 ui-monospace,
          'SFMono-Regular',
          Menlo,
          Consolas,
          monospace;
      }

      .page {
        width: min(960px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 36px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 14px;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 10px 16px;
        background: rgba(22, 26, 34, 0.88);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: #5b6983;
      }

      .frame {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 20%),
          rgba(22, 26, 34, 0.92);
        overflow: clip;
      }

      .scroller {
        position: relative;
        height: 520px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .content {
        position: relative;
      }

      .reference-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px dashed var(--reference);
        pointer-events: none;
        opacity: 0.92;
      }

      .reference-label {
        position: absolute;
        right: 16px;
        top: calc(50% - 12px);
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(15, 17, 23, 0.78);
        color: var(--reference);
        font-size: 12px;
        pointer-events: none;
      }

      .day-header {
        position: absolute;
        left: 16px;
        right: 16px;
        height: 24px;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card {
        position: absolute;
        left: 16px;
        right: 16px;
        height: 100px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 14px 16px;
        border-radius: 16px;
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.18);
      }

      .card-label {
        font-size: 24px;
        font-weight: 700;
      }

      .card-day {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.82;
      }

      .info {
        margin-top: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="controls">
        <button data-action="scroll-700" type="button">Scroll to 700</button>
        <button data-action="add-3" type="button">Add 3 above</button>
        <button data-action="rapid-add" type="button">Add 1, then 2 rapid</button>
      </div>

      <section class="frame">
        <div class="scroller" data-role="scroller">
          <div class="content" data-role="content"></div>
        </div>
        <div class="reference-line"></div>
        <div class="reference-label">reference</div>
      </section>

      <div class="info" data-role="info"></div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
