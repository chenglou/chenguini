<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #111318;
      --panel-bg: #181c24;
      --panel-border: #2a3040;
      --text: #e7ecf3;
      --muted: #8f99ad;
      --reference: #f5e663;
      --header-bg: #0f141c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(71, 85, 105, 0.22), transparent 40%),
        linear-gradient(180deg, #141821 0%, #0d0f14 100%);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    button {
      border: 1px solid var(--panel-border);
      background: #222938;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #2a3347;
    }

    .app {
      width: min(640px, calc(100vw - 32px));
      padding: 24px 0 28px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .viewport-shell {
      position: relative;
      height: 520px;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      overflow: hidden;
      box-shadow: rgba(0, 0, 0, 0.35) 0 18px 40px;
    }

    .reference-line {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% - 0.5px);
      height: 1px;
      background:
        linear-gradient(90deg, transparent 0%, rgba(245, 230, 99, 0.85) 12%, rgba(245, 230, 99, 0.85) 88%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    .scroller {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }

    .content {
      position: relative;
      width: 100%;
    }

    .day-header {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 24px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid rgba(143, 153, 173, 0.25);
      border-radius: 999px;
      background: var(--header-bg);
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .item {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 100px;
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: rgba(0, 0, 0, 0.25) 0 10px 24px;
    }

    .item-id {
      font-size: 12px;
      opacity: 0.85;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .item-label {
      font-size: 26px;
      font-weight: 700;
    }

    .item-day {
      font-size: 12px;
      opacity: 0.9;
    }

    .info {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <script type="module" src="./index.ts"></script>
</body>
