<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<body>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #18212f 0%, #0c1118 55%, #06090e 100%);
      color: #d9e2ec;
      font-family: "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    button {
      border: 1px solid #44536b;
      border-radius: 999px;
      padding: 8px 14px;
      background: #101925;
      color: #d9e2ec;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: #162233;
    }
    .app {
      width: min(720px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .scroller-shell {
      position: relative;
      border: 1px solid #2f3a4d;
      border-radius: 16px;
      background: linear-gradient(180deg, #0f1722 0%, #0a111a 100%);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      overflow: clip;
    }
    .scroller {
      position: relative;
      height: min(560px, calc(100vh - 180px));
      overflow-y: scroll;
      overflow-x: hidden;
    }
    .content {
      position: relative;
      width: 100%;
    }
    .reference-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px dashed rgba(199, 210, 254, 0.9);
      pointer-events: none;
      z-index: 3;
    }
    .day-header {
      position: absolute;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      color: #93a4bb;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 2;
    }
    .feed-item {
      position: absolute;
      left: 16px;
      right: 16px;
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      z-index: 1;
    }
    .feed-item-label {
      font-size: 14px;
    }
    .feed-item-day {
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
    }
    .info {
      color: #93a4bb;
      font-size: 12px;
      min-height: 18px;
    }
  </style>
  <script type="module" src="./index.ts"></script>
</body>
