<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<body>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0b0f15 0%, #121a24 100%);
      color: #e8edf2;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      padding: 24px 20px 20px;
      display: grid;
      justify-content: center;
      align-content: start;
      gap: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: min(920px, calc(100vw - 40px));
    }

    .control-button {
      border: 1px solid #334256;
      background: #182231;
      color: #dfe9f3;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .control-button:hover {
      background: #223043;
    }

    .viewport-shell {
      position: relative;
      width: min(920px, calc(100vw - 40px));
      height: 520px;
      border-radius: 18px;
      border: 1px solid #2a3442;
      background: #0f1620;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }

    .scroller {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-color: #314355 #0f1620;
      scrollbar-width: thin;
    }

    .content {
      position: relative;
      min-height: 100%;
    }

    .reference-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 3;
    }

    .header {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 24px;
      display: flex;
      align-items: center;
      color: #7d8fa2;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .item {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 100px;
      border-radius: 14px;
      padding: 14px 16px;
      color: white;
      display: grid;
      align-content: space-between;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .item-id {
      font-size: 12px;
      opacity: 0.8;
    }

    .item-label {
      font-size: 24px;
      line-height: 1;
    }

    .item-day {
      font-size: 12px;
      opacity: 0.75;
    }

    .info {
      width: min(920px, calc(100vw - 40px));
      color: #9db0c2;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <script type="module" src="./index.ts"></script>
</body>
