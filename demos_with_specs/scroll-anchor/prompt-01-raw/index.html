<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Anchor</title>
    <style>
      :root {
        --page-bg: #0a0e14;
        --panel-bg: #111821;
        --panel-border: #27303c;
        --text: #d6e1ef;
        --muted: #7f91a4;
        --reference: #f5e663;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background:
          radial-gradient(circle at top, rgba(46, 74, 107, 0.24), transparent 35%),
          linear-gradient(180deg, #0c131b 0%, var(--page-bg) 45%, #070a0f 100%);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .page {
        width: min(860px, calc(100vw - 32px));
        margin: 24px auto;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      button {
        border: 1px solid var(--panel-border);
        background: rgba(19, 28, 39, 0.92);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }

      button:hover {
        background: rgba(28, 40, 55, 0.92);
      }

      .scroll-shell {
        position: relative;
        border: 1px solid var(--panel-border);
        background: linear-gradient(180deg, rgba(13, 20, 29, 0.96), rgba(10, 15, 22, 0.96));
        border-radius: 16px;
        overflow: clip;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }

      .scroll-container {
        height: 600px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px 16px 24px;
      }

      .scroll-content {
        position: relative;
        width: 100%;
      }

      .reference-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px dashed rgba(245, 230, 99, 0.85);
        pointer-events: none;
        transform: translateY(-0.5px);
      }

      .reference-line::before {
        content: 'reference';
        position: absolute;
        right: 16px;
        top: -10px;
        background: rgba(10, 14, 20, 0.9);
        color: var(--reference);
        padding: 0 6px;
        font-size: 11px;
      }

      .header {
        position: absolute;
        left: 10px;
        right: 10px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        line-height: 24px;
      }

      .item {
        position: absolute;
        left: 10px;
        right: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 12px;
        padding: 0 18px;
        color: #f8fbff;
        font-size: 20px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .item-label {
        font-weight: 700;
      }

      .item-day {
        color: rgba(255, 255, 255, 0.74);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .info {
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .page {
          width: calc(100vw - 20px);
          margin: 10px auto;
        }

        .scroll-container {
          height: 520px;
          padding-inline: 10px;
        }

        .item {
          left: 2px;
          right: 2px;
          padding-inline: 12px;
          font-size: 18px;
        }

        .header {
          left: 2px;
          right: 2px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="controls">
        <button id="scroll-700" type="button">Scroll to 700</button>
        <button id="add-3-above" type="button">Add 3 above</button>
        <button id="add-rapid" type="button">Add 1, then 2 rapid</button>
      </section>

      <section class="scroll-shell">
        <div id="scroll-container" class="scroll-container">
          <div id="scroll-content" class="scroll-content"></div>
        </div>
        <div class="reference-line"></div>
      </section>

      <div id="info" class="info"></div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
