<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Anchor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="controls">
        <button type="button" data-action="scroll-700">Scroll to 700</button>
        <button type="button" data-action="add-3">Add 3 above</button>
        <button type="button" data-action="add-rapid">Add 1, then 2 rapid</button>
      </div>

      <section class="scroll-shell">
        <div class="scroll-container" data-scroll-container>
          <div class="content" data-content></div>
        </div>
        <div class="reference-line" aria-hidden="true"></div>
      </section>

      <p class="info-line" data-info></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
