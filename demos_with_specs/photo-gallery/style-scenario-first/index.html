<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06111f;
        --bg-soft: #0b1b31;
        --card: rgba(12, 22, 40, 0.9);
        --card-border: rgba(164, 191, 255, 0.14);
        --text: rgba(235, 242, 255, 0.94);
        --muted: rgba(210, 221, 245, 0.68);
        --accent: #c7d6ff;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #102743 0%, var(--bg) 48%, #04101d 100%);
        color: var(--text);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      body {
        overflow-x: hidden;
      }

      button,
      a {
        font: inherit;
      }

      #gallery-app {
        min-height: 100vh;
        position: relative;
      }

      #gallery-stage {
        position: relative;
        min-height: 100vh;
      }

      #grid-layer {
        position: relative;
        width: 100%;
      }

      #line-layer {
        position: fixed;
        inset: 0;
        display: none;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
        z-index: 20;
      }

      .photo-card {
        box-sizing: border-box;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(18, 29, 51, 0.96), rgba(10, 17, 31, 0.98));
        border: 1px solid var(--card-border);
        box-shadow: 0 22px 42px rgba(0, 0, 0, 0.26);
        overflow: hidden;
        transform-origin: top center;
        transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), opacity 180ms ease, filter 180ms ease;
        will-change: transform;
      }

      .photo-card__image {
        position: relative;
        display: block;
        width: 100%;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        cursor: zoom-in;
        user-select: none;
      }

      .photo-card__image-layer {
        display: block;
        width: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
      }

      .photo-card__image-layer--high {
        position: absolute;
        inset: 0;
        filter: saturate(1.1) contrast(1.04) brightness(1.04);
      }

      .photo-card__caption {
        margin: 0;
        padding: 8px 12px 8px;
        box-sizing: border-box;
        min-height: 52px;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        color: var(--muted);
        font-size: 14px;
        line-height: 20px;
        letter-spacing: -0.01em;
        user-select: text;
      }

      .photo-card__caption-text {
        display: inline;
      }

      .photo-card[data-focused="true"] {
        box-shadow: 0 28px 64px rgba(0, 0, 0, 0.36);
      }

      .line-zone {
        position: fixed;
        top: 0;
        bottom: 0;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        display: none;
        z-index: 30;
      }

      .line-zone--prev {
        left: 0;
        width: 100px;
        cursor: zoom-in;
      }

      .line-zone--next {
        right: 0;
        width: 100px;
        cursor: zoom-in;
      }

      .line-zone--dismiss {
        left: 100px;
        right: 100px;
        cursor: zoom-out;
      }

      .github-link {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 40;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(6, 14, 26, 0.72);
        color: var(--accent);
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      .github-link svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
