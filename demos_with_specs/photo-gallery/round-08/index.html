<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery Round 08</title>
    <style>
      :root {
        --page-bg: #08111f;
        --page-bg-glow: rgba(48, 81, 134, 0.24);
        --card-bg: rgba(12, 18, 31, 0.92);
        --card-border: rgba(185, 205, 255, 0.1);
        --card-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
        --text-main: #f3f7ff;
        --text-soft: rgba(230, 237, 255, 0.76);
        --caption-bg: rgba(10, 16, 28, 0.88);
        --chrome-bg: rgba(8, 13, 24, 0.74);
        --chrome-border: rgba(221, 232, 255, 0.14);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 20% 0%, var(--page-bg-glow), transparent 32%),
          radial-gradient(circle at 80% 10%, rgba(74, 99, 154, 0.16), transparent 28%),
          linear-gradient(180deg, #0a1120 0%, #08111f 100%);
        color: var(--text-main);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        overflow-x: hidden;
      }

      body.is-line-mode {
        overflow: hidden;
      }

      a {
        color: inherit;
      }

      #app {
        min-height: 100vh;
      }

      .gallery-shell {
        position: relative;
        min-height: 100vh;
      }

      .github-link {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 40;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 1px solid var(--chrome-border);
        background: var(--chrome-bg);
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      }

      .github-link svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .grid-surface {
        position: relative;
        width: 100%;
      }

      .grid-card {
        position: absolute;
        border-radius: 22px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        overflow: clip;
        box-shadow: var(--card-shadow);
        transform-origin: center center;
      }

      .grid-card__frame,
      .line-card__frame {
        position: relative;
        overflow: clip;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }

      .grid-card__frame {
        border-radius: 22px 22px 0 0;
      }

      .grid-card__img,
      .line-card__img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        pointer-events: none;
      }

      .grid-card__caption {
        height: 52px;
        padding: 12px 14px 8px;
        box-sizing: border-box;
        font-size: 14px;
        line-height: 1.2;
        color: var(--text-soft);
        background: linear-gradient(180deg, rgba(17, 24, 40, 0.66), var(--caption-bg));
        user-select: text;
        cursor: text;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }

      .line-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        background:
          radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.08), transparent 32%),
          rgba(4, 7, 14, 0.92);
        backdrop-filter: blur(18px);
      }

      .line-dismiss-layer {
        position: absolute;
        inset: 0;
        cursor: zoom-out;
      }

      .line-nav {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100px;
        z-index: 34;
        cursor: zoom-in;
      }

      .line-nav--left {
        left: 0;
      }

      .line-nav--right {
        right: 0;
      }

      .line-card {
        position: absolute;
        border-radius: 26px;
        overflow: clip;
        border: 1px solid rgba(220, 232, 255, 0.08);
        background: rgba(7, 11, 21, 0.88);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.34);
      }

      .line-card__frame {
        border-radius: 26px 26px 0 0;
      }

      .line-card__caption {
        height: 72px;
        padding: 12px 16px 8px;
        box-sizing: border-box;
        font-size: 15px;
        line-height: 1.25;
        color: rgba(236, 243, 255, 0.86);
        background: linear-gradient(180deg, rgba(17, 24, 40, 0.24), rgba(7, 10, 18, 0.9));
        overflow: hidden;
      }

      .line-card--focused .line-card__caption {
        overflow-y: auto;
      }

      .scenario-debug {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 60;
        max-width: min(520px, calc(100vw - 24px));
        max-height: 30vh;
        padding: 10px 12px;
        overflow: auto;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(8, 10, 16, 0.72);
        color: #eef4ff;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script id="scenario-report" type="application/json">
      {"phase":"loading","requestId":"","scenario":"","status":"ok"}
    </script>
    <pre id="scenario-debug" class="scenario-debug" hidden></pre>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
