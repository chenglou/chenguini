<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thin Photo Gallery</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #071122;
        --page-bg-soft: #0d1a34;
        --card-bg: rgba(13, 26, 48, 0.92);
        --card-border: rgba(171, 191, 255, 0.14);
        --caption: rgba(236, 241, 255, 0.94);
        --caption-muted: rgba(188, 200, 232, 0.9);
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
        background:
          radial-gradient(circle at top, rgba(44, 68, 118, 0.4), transparent 34%),
          linear-gradient(180deg, var(--page-bg-soft), var(--page-bg));
        color: var(--caption);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      #app {
        position: relative;
        min-height: 100%;
      }

      #grid-root {
        position: relative;
        min-height: 100%;
      }

      #line-overlay {
        position: fixed;
        inset: 0;
        display: none;
        isolation: isolate;
        overflow: hidden;
        background:
          radial-gradient(circle at center, rgba(34, 52, 89, 0.26), transparent 40%),
          rgba(5, 10, 24, 0.9);
        backdrop-filter: blur(22px);
      }

      #line-overlay::before,
      #line-overlay::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100px;
        pointer-events: none;
      }

      #line-overlay::before {
        left: 0;
        background: linear-gradient(90deg, rgba(89, 119, 181, 0.16), transparent);
      }

      #line-overlay::after {
        right: 0;
        background: linear-gradient(270deg, rgba(89, 119, 181, 0.16), transparent);
      }

      #scenario-report {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="grid-root"></div>
      <div id="line-overlay" data-line-overlay="true"></div>
      <script id="scenario-report" type="application/json"></script>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
