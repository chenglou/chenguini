<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Photo Gallery</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #07131f;
        --page-bg-soft: #102234;
        --card-bg: rgba(11, 21, 33, 0.86);
        --card-edge: rgba(255, 255, 255, 0.08);
        --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
        --caption: rgba(234, 231, 223, 0.9);
        --caption-soft: rgba(234, 231, 223, 0.68);
        --chrome: rgba(9, 18, 30, 0.82);
        --chrome-edge: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 0%, rgba(79, 137, 197, 0.18), transparent 30%),
          radial-gradient(circle at 80% 10%, rgba(182, 120, 72, 0.12), transparent 26%),
          linear-gradient(180deg, var(--page-bg-soft), var(--page-bg));
        color: #f4efe6;
        font-family: Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 120px),
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 3px,
            rgba(255, 255, 255, 0.01) 4px
          );
        opacity: 0.45;
      }

      a {
        color: inherit;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #scroll-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-gutter: stable;
        padding: 0 32px;
      }

      #grid-content {
        position: relative;
        width: 100%;
        min-height: 100%;
      }

      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }

      .photo-card {
        position: absolute;
        overflow: hidden;
        border-radius: 26px;
        border: 1px solid var(--card-edge);
        background-color: var(--card-bg);
        background-position: center;
        background-size: cover;
        box-shadow: var(--card-shadow);
        transform-origin: center center;
        pointer-events: auto;
      }

      .photo-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(7, 14, 24, 0.04), rgba(7, 14, 24, 0.38)),
          linear-gradient(180deg, transparent 58%, rgba(5, 9, 15, 0.52));
        pointer-events: none;
      }

      .photo-image-shell {
        position: absolute;
        overflow: hidden;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        background-position: center;
        background-size: cover;
      }

      .photo-hires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      .grid-caption {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 8px;
        height: 44px;
        color: var(--caption);
        font-size: 15px;
        line-height: 1.35;
        letter-spacing: 0.01em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        user-select: text;
        cursor: text;
        text-wrap: pretty;
      }

      #line-layer {
        position: fixed;
        inset: 0;
        opacity: 0;
        pointer-events: none;
      }

      #line-layer[data-visible='true'] {
        opacity: 1;
      }

      #line-backdrop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 30%, rgba(43, 83, 123, 0.22), transparent 34%),
          linear-gradient(180deg, rgba(6, 11, 18, 0.18), rgba(4, 8, 14, 0.58));
      }

      #line-track {
        position: absolute;
        inset: 0;
      }

      .line-caption {
        position: absolute;
        color: var(--caption);
        font-size: 16px;
        line-height: 1.45;
        overflow-y: auto;
        padding-right: 6px;
        user-select: text;
        text-wrap: pretty;
      }

      .line-caption::-webkit-scrollbar {
        width: 8px;
      }

      .line-caption::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .nav-strip {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100px;
        z-index: 10;
        pointer-events: auto;
      }

      #nav-left {
        left: 0;
      }

      #nav-right {
        right: 0;
      }

      #chrome-link {
        position: fixed;
        top: 18px;
        right: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 999px;
        border: 1px solid var(--chrome-edge);
        background: var(--chrome);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(14px);
        z-index: 40;
      }

      #chrome-link svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      #semantic-report {
        display: none;
      }

      @media (max-width: 760px) {
        #scroll-root {
          padding: 0 18px;
        }

        .grid-caption,
        .line-caption {
          font-size: 14px;
        }

        #chrome-link {
          width: 42px;
          height: 42px;
          top: 14px;
          right: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <a
        id="chrome-link"
        href="https://github.com/chenglou/vibescript/tree/main/demos_with_specs/photo-gallery/round-01"
        target="_blank"
        rel="noreferrer"
        aria-label="Open the round on GitHub"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.78.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.57-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.16-.68-.55-.01-.56.63-.01 1.08.59 1.23.84.72 1.26 1.87.91 2.33.69.07-.54.28-.91.51-1.12-1.78-.21-3.64-.92-3.64-4.07 0-.9.31-1.64.82-2.22-.08-.21-.36-1.05.08-2.18 0 0 .67-.22 2.2.85A7.46 7.46 0 0 1 8 3.89c.68 0 1.37.09 2.01.27 1.53-1.07 2.2-.85 2.2-.85.44 1.13.16 1.97.08 2.18.51.58.82 1.31.82 2.22 0 3.16-1.87 3.86-3.65 4.07.29.25.54.73.54 1.48 0 1.07-.01 1.94-.01 2.21 0 .22.15.49.55.4A8.2 8.2 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"
          ></path>
        </svg>
      </a>

      <div id="scroll-root">
        <div id="grid-content"></div>
      </div>

      <div id="stage"></div>

      <div id="line-layer" data-visible="false">
        <div id="line-backdrop"></div>
        <div id="line-track"></div>
        <div id="nav-left" class="nav-strip"></div>
        <div id="nav-right" class="nav-strip"></div>
      </div>

      <pre id="semantic-report"></pre>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
