<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery Round 05</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-top: #07111f;
        --bg-bottom: #02060c;
        --panel: rgba(9, 16, 29, 0.88);
        --panel-border: rgba(255, 255, 255, 0.08);
        --caption: rgba(229, 236, 255, 0.88);
        --muted: rgba(207, 216, 243, 0.58);
        --shadow: 0 16px 44px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(33, 61, 104, 0.38), transparent 38%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: white;
        font-family:
          "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia,
          serif;
      }

      body {
        overflow-x: clip;
      }

      a {
        color: inherit;
      }

      #app {
        position: relative;
        min-height: 100vh;
      }

      #gallery-surface {
        position: relative;
        min-height: 100vh;
      }

      .gallery-card {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow);
        overflow: clip;
        transform-origin: center center;
        isolation: isolate;
      }

      .gallery-card button,
      .gallery-card img {
        display: block;
      }

      .card-image {
        position: relative;
        width: 100%;
        flex: 1 1 auto;
        border-radius: 20px 20px 0 0;
        overflow: clip;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .card-image::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent, rgba(2, 6, 12, 0.1));
        pointer-events: none;
      }

      .card-image img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-caption {
        position: relative;
        padding: 12px 16px 8px;
        font-size: 14px;
        line-height: 1.35;
        color: var(--caption);
        user-select: text;
      }

      .card-caption-text {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .gallery-card[data-mode="line"] .card-caption {
        display: none;
      }

      #line-veil {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at center, rgba(14, 23, 40, 0.06), rgba(2, 4, 9, 0.84)),
          linear-gradient(180deg, rgba(4, 9, 16, 0.6), rgba(2, 4, 9, 0.92));
        opacity: 0;
        transition: opacity 120ms linear;
      }

      #line-dismiss-surface,
      #line-nav-left,
      #line-nav-right {
        position: fixed;
        inset: 0;
        opacity: 0;
        pointer-events: none;
      }

      #line-dismiss-surface {
        cursor: zoom-out;
      }

      #line-nav-left,
      #line-nav-right {
        width: 100px;
        inset-block: 0;
        cursor: zoom-in;
      }

      #line-nav-right {
        left: auto;
        right: 0;
      }

      #line-nav-left {
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), transparent 75%);
      }

      #line-nav-right {
        background: linear-gradient(270deg, rgba(255, 255, 255, 0.05), transparent 75%);
      }

      #line-caption-panel {
        position: fixed;
        left: 50%;
        bottom: 0;
        width: min(620px, calc(100vw - 48px));
        padding: 0 0 8px;
        transform: translateX(-50%);
        opacity: 0;
        pointer-events: none;
      }

      #line-caption-scroll {
        max-height: 64px;
        overflow-y: auto;
        padding: 16px 18px 8px;
        border-radius: 20px 20px 0 0;
        background: rgba(8, 13, 24, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
        color: var(--caption);
        font-size: 15px;
        line-height: 1.45;
      }

      #github-link {
        position: fixed;
        right: 24px;
        top: 18px;
        z-index: 30;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        background: rgba(6, 11, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(14px);
      }

      #github-link svg {
        width: 19px;
        height: 19px;
      }

      #scenario-report {
        display: none;
      }

      body[data-line-mode="true"] #line-veil,
      body[data-line-mode="true"] #line-dismiss-surface,
      body[data-line-mode="true"] #line-nav-left,
      body[data-line-mode="true"] #line-nav-right,
      body[data-line-mode="true"] #line-caption-panel {
        opacity: 1;
        pointer-events: auto;
      }

      body[data-line-mode="true"] {
        cursor: zoom-out;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <a
        id="github-link"
        href="https://github.com/chenglou/vibescript"
        aria-label="View source on GitHub"
        target="_blank"
        rel="noreferrer"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52 0-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.52 7.52 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
      </a>
      <div id="gallery-surface"></div>
      <div id="line-veil"></div>
      <div id="line-dismiss-surface" aria-hidden="true"></div>
      <div id="line-nav-left" aria-hidden="true"></div>
      <div id="line-nav-right" aria-hidden="true"></div>
      <div id="line-caption-panel" aria-live="polite">
        <div id="line-caption-scroll"></div>
      </div>
      <script id="scenario-report" type="application/json">
        {"status":"ok","phase":"loading","requestId":"","scenario":"manual"}
      </script>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
