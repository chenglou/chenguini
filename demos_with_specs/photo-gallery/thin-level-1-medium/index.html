<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
        background: #f4efe8;
        color: #251d17;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.72), transparent 45%),
          linear-gradient(180deg, #f8f4ee 0%, #f0e8df 100%);
      }

      body {
        overflow-x: hidden;
      }

      img {
        display: block;
        max-width: none;
      }

      #app {
        position: relative;
        min-height: 100vh;
      }

      #grid-root {
        position: relative;
      }

      .grid-card {
        position: absolute;
      }

      .grid-frame {
        position: absolute;
        left: 0;
        top: 0;
        overflow: clip;
        border-radius: 24px;
        background: rgba(126, 101, 83, 0.18);
        box-shadow:
          0 22px 48px rgba(90, 64, 44, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.55);
        cursor: pointer;
      }

      .grid-frame img,
      .line-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .grid-caption {
        position: absolute;
        left: 0;
        right: 0;
        overflow: hidden;
        font-size: 15px;
        line-height: 1.35;
        letter-spacing: 0.01em;
        cursor: text;
        user-select: text;
      }

      #line-overlay {
        position: fixed;
        inset: 0;
        display: none;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.45), transparent 38%),
          rgba(243, 237, 229, 0.97);
        backdrop-filter: blur(12px);
        overflow: hidden;
      }

      #line-track {
        position: absolute;
        inset: 0;
      }

      .line-card {
        position: absolute;
      }

      .line-frame {
        position: absolute;
        inset: 0;
        overflow: clip;
        border-radius: 28px;
        background: rgba(113, 85, 58, 0.15);
        box-shadow:
          0 28px 72px rgba(69, 46, 29, 0.16),
          inset 0 0 0 1px rgba(255, 255, 255, 0.55);
      }

      .line-card[data-focused="false"] .line-frame {
        box-shadow:
          0 18px 44px rgba(69, 46, 29, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      }

      #line-caption {
        position: absolute;
        left: 100px;
        right: 100px;
        overflow: hidden;
        text-align: center;
        font-size: 18px;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }

      #scenario-report {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="grid-root"></div>
      <div id="line-overlay" aria-hidden="true">
        <div id="line-track"></div>
        <div id="line-caption"></div>
      </div>
      <script id="scenario-report" type="application/json"></script>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
