<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --bg-deep: #050b16;
        --card: #0f1a2c;
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #e6eef9;
        --muted: rgba(230, 238, 249, 0.74);
        --shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(58, 93, 141, 0.24), transparent 40%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--text);
        font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
      }

      body {
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      #app {
        min-height: 100vh;
      }

      .shell {
        position: relative;
        min-height: 100vh;
      }

      .spacer {
        width: 100%;
      }

      .chrome {
        position: fixed;
        inset: 0 0 auto 0;
        padding: 20px 24px 0;
        display: flex;
        justify-content: flex-end;
        pointer-events: none;
        z-index: 30;
      }

      .github-link {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(6, 10, 18, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      }

      .github-link svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .gallery-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      .photo-card {
        position: absolute;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(15, 26, 44, 0.98), rgba(10, 17, 30, 0.98));
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow);
        transform-origin: top left;
        will-change: transform, width, height;
      }

      .photo-card[data-mounted='false'] {
        display: none;
      }

      .photo-card[data-mode='grid'] {
        cursor: zoom-in;
        pointer-events: auto;
      }

      .photo-card[data-mode='line'] {
        pointer-events: none;
      }

      .photo-media {
        position: relative;
        border-radius: 18px 18px 0 0;
        overflow: hidden;
        background: #08111f;
      }

      .photo-media img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }

      .photo-media .low-res {
        filter: blur(10px) saturate(0.96);
        transform: scale(1.06);
      }

      .photo-media .high-res {
        opacity: 0;
        transition: opacity 120ms linear;
      }

      .photo-media .high-res[data-visible='true'] {
        opacity: 1;
      }

      .photo-caption {
        box-sizing: border-box;
        padding: 0 14px 8px;
        color: var(--text);
        line-height: 1.28;
        letter-spacing: 0.01em;
        text-wrap: balance;
        overflow: hidden;
      }

      .photo-caption[data-mode='grid'] {
        font-size: 14px;
        height: 52px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .photo-caption[data-mode='line'] {
        font-size: 16px;
        height: 72px;
      }

      .nav-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
      }

      .nav-overlay[data-open='true'] {
        display: block;
      }

      .nav-strip {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100px;
        background: rgba(4, 7, 13, 0.28);
        backdrop-filter: blur(2px);
      }

      .nav-strip button {
        all: unset;
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      .nav-strip[data-side='left'] {
        left: 0;
      }

      .nav-strip[data-side='right'] {
        right: 0;
      }

      .nav-dim {
        position: absolute;
        inset: 0 100px;
        background: rgba(0, 0, 0, 0);
        cursor: zoom-out;
      }

      #scenario-report {
        position: fixed;
        left: -9999px;
        top: -9999px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script id="scenario-report" type="application/json">{"phase":"loading","requestId":"","scenario":""}</script>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
