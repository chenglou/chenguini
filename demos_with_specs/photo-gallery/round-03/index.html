<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery Round 03</title>
    <style>
      :root {
        --page-bg: #07111d;
        --page-bg-2: #0f2030;
        --card-bg: rgba(12, 22, 34, 0.92);
        --card-border: rgba(255, 255, 255, 0.08);
        --caption: rgba(237, 241, 245, 0.88);
        --caption-dim: rgba(213, 223, 233, 0.62);
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.28);
        --chrome: rgba(255, 255, 255, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background:
          radial-gradient(circle at top left, rgba(103, 153, 201, 0.18), transparent 30%),
          radial-gradient(circle at 80% 16%, rgba(84, 131, 162, 0.16), transparent 22%),
          linear-gradient(180deg, var(--page-bg-2) 0%, var(--page-bg) 48%, #040a13 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        color: white;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      }

      a {
        color: inherit;
      }

      #app {
        position: relative;
        min-height: 100vh;
      }

      #gallery {
        position: relative;
        min-height: 100vh;
      }

      .chrome-link {
        position: fixed;
        top: 20px;
        right: 24px;
        z-index: 40;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        color: var(--chrome);
        background: rgba(8, 16, 27, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(14px);
        text-decoration: none;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
      }

      .chrome-link svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      .overlay-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background:
          radial-gradient(circle at center, rgba(34, 51, 71, 0.32), rgba(4, 9, 15, 0.82) 70%),
          linear-gradient(180deg, rgba(4, 10, 17, 0.42), rgba(4, 10, 17, 0.88));
        pointer-events: none;
        opacity: 0;
      }

      .nav-strip {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 100px;
        z-index: 30;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.02), transparent 72%);
      }

      .nav-strip.right {
        right: 0;
        background: linear-gradient(270deg, rgba(255, 255, 255, 0.02), transparent 72%);
      }

      .nav-strip.left {
        left: 0;
      }

      .gallery-card {
        position: absolute;
        display: block;
        overflow: hidden;
        border-radius: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow);
        transform-origin: center center;
        contain: layout style paint;
        user-select: none;
      }

      .gallery-card * {
        user-select: none;
      }

      .image-shell {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)),
          rgba(11, 18, 28, 0.96);
      }

      .image-lowres {
        position: absolute;
        inset: 0;
        background-position: center center;
        background-size: cover;
        filter: saturate(0.94) brightness(0.86);
        transform: scale(1.05);
      }

      .image-highres {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-caption {
        width: 100%;
        padding: 14px 16px 8px;
        color: var(--caption);
        font-size: 14px;
        line-height: 1.34;
        letter-spacing: 0.01em;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      #semantic-report {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <a
        class="chrome-link"
        href="https://github.com/chenglou/vibescript"
        target="_blank"
        rel="noreferrer"
        aria-label="Open GitHub repository"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.69 0 8.24c0 3.64 2.29 6.72 5.47 7.81.4.08.55-.18.55-.39 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.16-.28-.16-.68-.57-.01-.58.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.54.28-.88.51-1.08-1.78-.21-3.64-.92-3.64-4.1 0-.91.32-1.65.84-2.23-.08-.21-.36-1.06.08-2.2 0 0 .69-.23 2.26.85A7.66 7.66 0 0 1 8 4.76c.68 0 1.36.09 2 .27 1.57-1.08 2.26-.85 2.26-.85.44 1.14.16 1.99.08 2.2.52.58.84 1.32.84 2.23 0 3.19-1.87 3.89-3.65 4.1.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.47.55.39A8.27 8.27 0 0 0 16 8.24C16 3.69 12.42 0 8 0Z"
          ></path>
        </svg>
      </a>
      <div id="overlay-backdrop" class="overlay-backdrop"></div>
      <div id="nav-left" class="nav-strip left" aria-hidden="true"></div>
      <div id="nav-right" class="nav-strip right" aria-hidden="true"></div>
      <div id="gallery"></div>
      <pre id="semantic-report"></pre>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
