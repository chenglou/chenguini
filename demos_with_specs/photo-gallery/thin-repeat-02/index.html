<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thin Repeat 02 Photo Gallery</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #ece5d8;
        --page-bg-shadow: #d9cfc0;
        --card-bg: rgba(255, 251, 245, 0.92);
        --card-shadow: rgba(76, 58, 43, 0.18);
        --caption: #30221c;
        --muted: rgba(48, 34, 28, 0.58);
        --overlay: rgba(17, 13, 13, 0.7);
        --overlay-border: rgba(255, 255, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background:
          radial-gradient(circle at top, rgba(255, 248, 236, 0.95), transparent 38%),
          linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-shadow) 100%);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      html.gallery-line-open {
        overflow: hidden;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--caption);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.55), transparent 24%),
          radial-gradient(circle at 86% 18%, rgba(247, 221, 174, 0.36), transparent 28%),
          radial-gradient(circle at 74% 74%, rgba(179, 108, 73, 0.14), transparent 26%);
      }

      #app {
        position: relative;
      }

      .gallery-grid-layer {
        position: relative;
      }

      .gallery-card {
        position: absolute;
        display: flex;
        flex-direction: column;
        padding: 12px 12px 8px;
        border-radius: 26px;
        background: var(--card-bg);
        box-shadow:
          0 22px 48px -28px var(--card-shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(8px);
      }

      .gallery-card__media {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(209, 192, 171, 0.58));
        overflow: hidden;
        cursor: pointer;
      }

      .gallery-card__image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .gallery-card__caption {
        margin: 12px 2px 0;
        max-height: 44px;
        overflow: hidden;
        color: var(--caption);
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 16px;
        line-height: 22px;
        user-select: text;
        cursor: text;
      }

      .gallery-line-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background:
          linear-gradient(180deg, rgba(17, 13, 13, 0.9), var(--overlay)),
          radial-gradient(circle at top, rgba(255, 248, 236, 0.08), transparent 34%);
        backdrop-filter: blur(22px);
      }

      .gallery-line-strip {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 244, 225, 0.84);
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .gallery-line-strip--left {
        left: 0;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.08), transparent);
      }

      .gallery-line-strip--right {
        right: 0;
        background: linear-gradient(270deg, rgba(255, 255, 255, 0.08), transparent);
      }

      .gallery-line-card {
        position: absolute;
        padding: 14px;
        border-radius: 28px;
        background: rgba(248, 240, 229, 0.16);
        border: 1px solid var(--overlay-border);
        box-shadow: 0 28px 54px -24px rgba(0, 0, 0, 0.42);
      }

      .gallery-line-card--focused {
        background: rgba(255, 250, 243, 0.18);
      }

      .gallery-line-card__image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 18px;
      }

      .gallery-line-caption {
        position: absolute;
        left: 50%;
        width: min(620px, calc(100vw - 160px));
        transform: translateX(-50%);
        color: rgba(255, 247, 235, 0.96);
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 23px;
        line-height: 32px;
        max-height: 64px;
        overflow: hidden;
        text-align: center;
      }

      .gallery-line-hint {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        color: rgba(255, 244, 225, 0.72);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        .gallery-card {
          border-radius: 22px;
          padding: 10px 10px 8px;
        }

        .gallery-card__caption {
          font-size: 15px;
        }

        .gallery-line-caption {
          width: calc(100vw - 88px);
          font-size: 20px;
          line-height: 28px;
        }

        .gallery-line-hint {
          width: calc(100vw - 48px);
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script id="scenario-report" type="application/json"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
