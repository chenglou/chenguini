<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Global Illumination - Live</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(circle at top, rgba(30, 44, 71, 0.8), rgba(7, 10, 18, 1) 58%),
      linear-gradient(180deg, #111827, #04070d);
  }

  body {
    font-family: Baskerville, Georgia, serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .hud {
    position: fixed;
    top: 22px;
    left: 22px;
    padding: 14px 18px 16px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    background: rgba(7, 10, 18, 0.58);
    backdrop-filter: blur(16px);
    color: rgba(247, 244, 235, 0.92);
    pointer-events: none;
  }

  .hud-title {
    margin: 0 0 4px;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .hud-copy {
    margin: 0;
    max-width: 260px;
    font-size: 17px;
    line-height: 1.3;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hud">
  <p class="hud-title">Live Color Bounce</p>
  <p class="hud-copy">Move the light. This one is deterministic, so it stays live without temporal accumulation.</p>
</div>
<script src="./index.ts" type="module"></script>
</body>
</html>
