<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll Anchoring – Plain JS (Manual Render Loop)</title>
<!--
  SCROLL ANCHORING – PLAIN JS REFERENCE
  ======================================

  A minimal scroll anchoring implementation using a manual render loop
  (scheduleRender → rAF → render). No framework, no flags, no workarounds.

  Architecture:
    All events (scroll, resize, data changes) just call scheduleRender().
    Each render reads scrollTop once, computes layout, adjusts scroll if
    needed, and reads back the actual scrollTop after scrollTo.

  Why this is simpler than React:
    React 18 automatic batching can merge a scroll event's setState with
    unrelated data setState into one render. The value-comparison approach
    (storedScrollTop) works around this, but the manual render loop avoids
    the problem entirely — events just schedule renders, scrollTo from
    frame N is fully resolved by frame N+1, and no refs are needed.

  Detecting "user scrolled" vs "data changed":
    Compare currentScrollY to storedScrollY (the read-back value from
    last frame's scrollTo). If they differ, something external changed
    the scroll position (user scroll, momentum, etc.) → pick a new
    anchor. If they match, only data changed → adjust scroll to keep
    the anchor stable.

  Truncation handling (Scrolling.md points 3-4):
    After scrollTo, read back container.scrollTop and store THAT value
    (not the requested value). Browser truncation varies: Chrome rounds
    to 0.5, Safari/Firefox to integers. Storing the read-back value
    prevents false "user scrolled" detection from truncation mismatch.
    This repro uses integer heights so truncation doesn't manifest here,
    but the read-back pattern is included as the correct general approach.

  Cases demonstrated:
    1. "Add 3 above" – items prepended while scrolled down. Anchor
       adjustment keeps visible items stable.
    2. "Add 1, then 2 rapid" – two separate data changes in quick
       succession (simulates rapid async updates). Each is a separate render, each
       adjusts correctly. No double-counting, no flags.
    3. User scroll – scroll manually, then add items. New anchor is
       picked from the new scroll position.
    4. Resize – narrow/widen the browser. Anchor keeps visible items
       stable (items reflow but scroll compensates).

  Limitation (Scrolling.md point 5):
    If the user scrolls between our scrollTo and the next frame's
    scrollTop read, we see the combined result and pick a new anchor.
    This is correct behavior (adapt to where the user ended up).

  Limitation (Scrolling.md points 3-4 footnote):
    Continuous resize with fractional layout values causes sub-pixel
    anchor jitter from scrollTop truncation accumulating over frames.
    This is a fundamental browser limitation, not an architectural bug.
    Cannot be demonstrated here (integer heights produce integer math).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; height: 100vh; padding: 12px; }
  h2 { font-size: 14px; margin-bottom: 4px; }
  .subtitle { font-size: 11px; color: #888; margin-bottom: 8px; line-height: 1.4; }
  .controls { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .controls button {
    padding: 6px 12px;
    font-family: monospace;
    font-size: 12px;
    cursor: pointer;
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
  }
  .controls button:hover { background: #444; }
  .controls button.primary { background: #2980b9; border-color: #3498db; }
  .controls button.primary:hover { background: #3498db; }
  .scroll-wrapper { flex: 1; position: relative; min-height: 0; }
  .scroll-container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow-y: scroll;
    border: 2px solid #555;
    background: #111;
  }
  .item {
    position: absolute;
    left: 8px;
    right: 8px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    color: white;
    font-weight: bold;
    border-radius: 4px;
  }
  .day-header {
    position: absolute;
    left: 8px;
    right: 8px;
    display: flex;
    align-items: flex-end;
    font-size: 11px;
    color: #999;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
  }
  .ref-line {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(255, 60, 60, 0.4);
    pointer-events: none;
    z-index: 10;
  }
  .ref-label {
    position: absolute;
    top: 50%;
    right: 4px;
    transform: translateY(-100%);
    font-size: 9px;
    color: rgba(255, 60, 60, 0.6);
    pointer-events: none;
    z-index: 10;
  }
  .info { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<h2>PLAIN JS – Manual Render Loop</h2>
<div class="subtitle">
  All events just scheduleRender(). Each render reads scrollTop once,
  computes layout, scrollTo if needed, reads back actual value. No flags.
</div>
<div class="controls">
  <button onclick="scrollToTarget()">1. Scroll to 700</button>
  <button class="primary" onclick="addItemsAbove(3)">2. Add 3 above</button>
  <button onclick="addOneThenTwo()">Add 1, then 2 rapid</button>
  <button onclick="resetAll()">Reset</button>
</div>
<div class="scroll-wrapper">
  <div id="container" class="scroll-container">
    <div id="spacer" style="position: relative;"></div>
  </div>
  <div class="ref-line"></div>
  <div class="ref-label">reference line</div>
</div>
<div id="info" class="info"></div>

<script>
'use strict';

// Layout constants (same as React repro)
const ITEM_HEIGHT = 100;
const HEADER_HEIGHT = 24;
const HEADER_GAP_FIRST = 0;
const HEADER_GAP_REST = 32;
const HEADER_GAP_BOTTOM = 8;
const ITEM_GAP = 8;
const TARGET_SCROLL = 700;

const COLORS = [
  '#c0392b', '#2980b9', '#27ae60', '#8e44ad',
  '#d35400', '#16a085', '#2c3e50', '#f39c12',
];

// === State ===
let counter = 0;
let items = [];
let anchor = null; // { id, prevY }
let storedScrollY = 0; // read-back value from last frame's scrollTo

const container = document.getElementById('container');
const spacer = document.getElementById('spacer');
const info = document.getElementById('info');

// DOM node pool (reuse instead of recreate)
let domNodes = [];

function makeItem(day) {
  const n = counter++;
  return { id: 'V' + n, day: day, label: '#' + n, color: COLORS[n % COLORS.length] };
}

function makeInitialItems() {
  const result = [];
  for (let i = 0; i < 8; i++) result.push(makeItem('Today'));
  for (let i = 0; i < 1; i++) result.push(makeItem('Yesterday'));
  for (let i = 0; i < 8; i++) result.push(makeItem('2 Days Ago'));
  return result;
}

// === Scheduler ===
let scheduled = false;
function scheduleRender() {
  if (scheduled) return;
  scheduled = true;
  requestAnimationFrame(render);
}

// === Events ===
// All events just schedule a render. No state mutation, no flags.
container.addEventListener('scroll', scheduleRender);
window.addEventListener('resize', scheduleRender);

// === Render ===
function render() {
  scheduled = false;

  // Step 1: Read DOM (batched reads, no writes yet)
  const currentScrollY = container.scrollTop;

  // Step 2: Detect user scroll
  // If currentScrollY differs from what we stored last frame, something
  // external changed the scroll position. Pick a new anchor.
  const userScrolled = currentScrollY !== storedScrollY;

  // Step 3: Compute layout
  let y = 0;
  let adjustedScrollTop = currentScrollY;
  let newAnchor = null;
  let isFirstSession = true;
  let idx = 0;
  // Track which DOM nodes we need
  let nodeIdx = 0;

  while (idx < items.length) {
    const sessionDay = items[idx].day;
    const gapTop = isFirstSession ? HEADER_GAP_FIRST : HEADER_GAP_REST;
    const headerY = y + gapTop;
    y += gapTop + HEADER_HEIGHT + HEADER_GAP_BOTTOM;

    // Header
    const headerNode = getOrCreateNode(nodeIdx++, 'day-header');
    headerNode.style.top = headerY + 'px';
    headerNode.style.height = HEADER_HEIGHT + 'px';
    headerNode.textContent = sessionDay;

    let firstInSession = true;
    while (idx < items.length && items[idx].day === sessionDay) {
      const item = items[idx];
      if (!firstInSession) y += ITEM_GAP;
      firstInSession = false;

      // Pick new anchor: first item below scrollTop
      if (userScrolled && newAnchor == null && y > currentScrollY) {
        newAnchor = { id: item.id, prevY: y };
      }

      // Anchor adjustment: compute scroll delta
      if (!userScrolled && anchor != null && item.id === anchor.id && currentScrollY > 40) {
        adjustedScrollTop = currentScrollY + (y - anchor.prevY);
        anchor.prevY = y;
      }

      // Item
      const itemNode = getOrCreateNode(nodeIdx++, 'item');
      itemNode.style.top = y + 'px';
      itemNode.style.height = ITEM_HEIGHT + 'px';
      itemNode.style.background = item.color;
      itemNode.textContent = item.label + ' \u2014 ' + item.day;

      y += ITEM_HEIGHT;
      idx++;
    }
    isFirstSession = false;
  }

  // Remove excess DOM nodes
  while (nodeIdx < domNodes.length) {
    const node = domNodes.pop();
    node.remove();
  }

  // Update anchor
  if (userScrolled && newAnchor != null) {
    anchor = newAnchor;
  }

  // Step 4: Write DOM (batched writes)
  spacer.style.height = y + 'px';

  if (adjustedScrollTop !== currentScrollY) {
    container.scrollTo({ top: adjustedScrollTop, behavior: 'instant' });
    // Read back actual value after scrollTo. Do NOT store the requested
    // value — browser truncation (Chrome: 0.5, Safari/Firefox: integers)
    // would cause a false mismatch on the next frame, making us think
    // the user scrolled when they didn't. (Scrolling.md points 3-4)
    storedScrollY = container.scrollTop;
  } else {
    storedScrollY = currentScrollY;
  }

  // Update info
  info.textContent =
    'scrollTop: ' + Math.round(container.scrollTop) +
    ' | anchor: ' + (anchor ? anchor.id : 'none') +
    ' (prevY: ' + (anchor ? Math.round(anchor.prevY) : '-') + ')' +
    ' | items: ' + items.length;
}

// === DOM node pool ===
function getOrCreateNode(idx, className) {
  if (idx < domNodes.length) {
    const node = domNodes[idx];
    if (node.className !== className) node.className = className;
    return node;
  }
  const node = document.createElement('div');
  node.className = className;
  spacer.appendChild(node);
  domNodes.push(node);
  return node;
}

// === Actions ===
function scrollToTarget() {
  container.scrollTo({ top: TARGET_SCROLL, behavior: 'instant' });
  // The scroll event fires and calls scheduleRender(). The next render
  // sees currentScrollY !== storedScrollY and picks a new anchor.
}

function addItemsAbove(n) {
  for (let i = 0; i < n; i++) items.unshift(makeItem('Today'));
  scheduleRender();
}

function addOneThenTwo() {
  // Two separate data changes in quick succession (simulates rapid async updates).
  // Whether they land in one render or two depends on timing — works
  // either way. If one render: sees all 3, adjusts once. If two
  // renders: each adjusts for its new items, prevY updated between.
  items.unshift(makeItem('Today'));
  scheduleRender();
  setTimeout(function() {
    items.unshift(makeItem('Today'), makeItem('Today'));
    scheduleRender();
  }, 0);
}

function resetAll() {
  counter = 0;
  anchor = null;
  items = makeInitialItems();
  // Scroll to 0 synchronously (spacer is still tall from last render)
  container.scrollTo({ top: 0, behavior: 'instant' });
  storedScrollY = 0;
  scheduleRender();
}

// === Init ===
items = makeInitialItems();
scheduleRender();
</script>
</body>
</html>
