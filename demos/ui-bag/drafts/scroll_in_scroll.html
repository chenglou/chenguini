<body>
  <style>
    .container {
      width: 200px;
      height: 350px;
      outline: 1px solid lightgray;
      overflow: scroll;
    }
    .row {
      height: 100px;
      outline: 1px solid lightgray;
    }
  </style>
  <div class="container">
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
  </div>
  <script>
    let container = document.getElementsByClassName("container")[0];
    container.addEventListener("scroll", () => {
      console.log("scrolled");
      container.scrollTo(0, Math.random() * 500);
    });
    function loop() {
      console.log("loop");
      requestAnimationFrame(loop);
    }
    loop();
    // loop & scroll are interleaved, aka on different frames, aka calling
    // scrollTo inside scroll event defers the event to the next frame
  </script>
</body>
