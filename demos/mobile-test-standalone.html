<!DOCTYPE html>
<!--
  Standalone reproduction of the MobileCreationView component (commit b767b9dcd)
  from midjourney/mj-gallery-2. Used to test mobile Safari-specific behaviors:
  input blur/focus, overflow, gestures, page zoom, soft keyboard interactions.

  == LAYOUT/CSS PITFALLS — DO NOT ==

  1. Do NOT add styles to <html> or <body> beyond what's here. The original app
     had conflicting global.css rules (min-height: 100vh, height: -webkit-fill-available)
     that MobileCreation.tsx countered with a 100dvh override. This standalone has
     neither side, intentionally. Adding height/overflow to html/body breaks the
     Safari-specific behaviors we're testing (rubber-banding, pinch zoom, etc.).

  2. Do NOT use `overflow: hidden` on body. The .container_ div handles its own
     scroll via `overscroll-behavior: contain` and toggling `overflow-y: auto/hidden`
     between view modes. Body-level overflow constraints change Safari's gesture
     behavior.

  3. The original app's DOM was deeply nested:
       body > #app-root > #__next > #bodyContainer > parentContainer
     This standalone is flat: body > #container (parentContainer). That's fine —
     the extra nesting had no layout effect relevant here.

  4. color-scheme must be "light", not "dark". The original _document.tsx had dark,
     but the mobile creation view itself is beige-themed and sets its own colors.

  5. CSS class `.container_` has a trailing underscore. The JS sets
     className = 'container_'. If your CSS says `.container` (no underscore),
     scrolling breaks silently.

  6. `touch-action: none` on body is intentional — the component does all its own
     touch handling (touchstart/touchmove/pointerup). Removing it causes double-
     handling with the browser's native gestures.

  == JS PITFALLS ==

  7. Springs are initialized with NaN (pos = NaN) to surface bugs early. On first
     render you MUST call springGoToEnd() on all springs after computing their
     destinations. The original code does this via the justLoadedOldJobs path.
     Forgetting this = invisible images (translate3d(NaN, NaN, 0)).

  8. The original fetchRecentAPI uses a callback pattern (not async/Promise) in
     older commits. If stubbing it, support `opts.callback(null, result)`.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta content="light" name="color-scheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<title>Mobile Creation Standalone</title>
<style>
  body {
    touch-action: none;
    background-color: rgb(255, 246, 240);
    margin: 0;
    font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  }

  .composer {
    position: absolute;
    display: flex;
    align-items: stretch;
    gap: 12px;
    color: rgb(15, 9, 7);
    background-color: rgb(255, 246, 240);
    box-sizing: border-box;
    box-shadow:
      rgba(230, 135, 40, 0.4) 0px -1px 0px 0px,
      rgba(0, 0, 0, 0.07) 0px 10px 33px 0px;
    bottom: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .input {
    flex: 1;
    font-size: 1rem;
    color: inherit;
    border: none;
    background-color: inherit;
  }

  .input:focus {
    outline: none;
  }

  .chevron {
    align-self: center;
    font-size: 13.3333px;
    display: flex;
    place-items: center;
    border: none;
    color: rgb(56, 41, 33);
    background-color: rgb(235, 163, 81);
    border-radius: 100%;
    cursor: pointer;
    transition: transform 0.1s ease-out;
  }

  .chevron:hover {
    background-color: rgb(235 163 81 / 0.6);
  }

  .chevron svg {
    position: absolute;
    left: 6px;
  }

  .container_ {
    position: absolute;
    background-color: rgb(255, 250, 243);
    overscroll-behavior: contain;
    overflow-x: hidden;
  }

  .header {
    box-sizing: border-box;
    position: absolute;
    opacity: 0;
    transition: opacity 0.1s ease-out;
    color: rgb(111, 68, 12);
    padding: 8px 12px 8px 12px;
  }

  .image {
    position: absolute;
    overflow: hidden;
    background-color: rgb(255, 246, 240);
    border-radius: 8px;
    background-size: 100%;
    background-repeat: no-repeat;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .image img {
    display: block;
    width: 100%;
    pointer-events: all;
  }
</style>
</head>
<body>
<div id="container" style="position:absolute;width:100%;height:100%;"></div>
<script>
// === spring physics (from MidUI.ts)
var msPerStep = 6
function spring(pos) { return { pos: pos, dest: pos, v: 0, k: 333, b: 33 } }
function springStep(s) {
  var t = msPerStep / 1000
  var F = -s.k * (s.pos - s.dest) - s.b * s.v
  s.v += F * t
  s.pos += s.v * t
}
function springGoToEnd(s) { s.pos = s.dest; s.v = 0 }
function center(a, b) { return (b - a) / 2 }
function fit(ar, maxW, maxH) { return Math.min(maxW, maxH * ar) }
function remap(v, oMin, oMax, nMin, nMax) {
  if (oMin === oMax) return (nMin + nMax) / 2
  return (v - oMin) / (oMax - oMin) * (nMax - nMin) + nMin
}
function insideInclusive(x1, y1, x2, y2, sx, sy) { return x2 <= x1 && x1 <= x2 + sx && y2 <= y1 && y1 <= y2 + sy }
function overlapInclusive(x1, y1, sx1, sy1, x2, y2, sx2, sy2) { return x1 <= x2 + sx2 && x2 <= x1 + sx1 && y1 <= y2 + sy2 && y2 <= y1 + sy1 }
function lessEqual(a, b, c) { return a <= b && b <= c }
function clamp(min, v, max) { return v > max ? max : v < min ? min : v }
function length(x, y) { return Math.sqrt(x * x + y * y) }

// === scheduler
var scheduledRender = false
function scheduleRender() {
  if (scheduledRender) return
  scheduledRender = true
  requestAnimationFrame(function(now) {
    scheduledRender = false
    if (render(now)) scheduleRender()
  })
}

// === layout constants
var headerGapTop = 28, headerGapBottom = 8
var composerGapX = 0
var chevronGapLeft = 20, chevronSize = 28
var regularImagesGap = 12
var lightboxImagesGapX = 16, lightboxImageGapY = 20
var lightboxHitAreaSizeX = 12
var imageBoxShadowAsBorder = '0 0px 2px 0 rgba(255, 255, 255, 0.2)'
var imageBoxShadowCollapsed = '0 4px 4px 0 rgba(0, 0, 0, 0.2)'

// === fake jobs
var fakeJobs = [
  { id: 'aaa11111', prompt: 'A cozy cabin in the woods, morning light filtering through trees', enqueue_time: '2023-06-15T10:00:00Z', event: { width: 1344, height: 896, batchSize: 4 } },
  { id: 'bbb22222', prompt: 'Neon cyberpunk cityscape at night, rain reflections', enqueue_time: '2023-06-15T09:55:00Z', event: { width: 1024, height: 1024, batchSize: 4 } },
  { id: 'ccc33333', prompt: 'Underwater coral reef, tropical fish, volumetric light rays', enqueue_time: '2023-06-15T09:50:00Z', event: { width: 896, height: 1344, batchSize: 4 } },
  { id: 'ddd44444', prompt: 'Abstract geometric patterns, bold colors, bauhaus style', enqueue_time: '2023-06-15T09:45:00Z', event: { width: 1424, height: 848, batchSize: 4 } },
  { id: 'eee55555', prompt: 'Mountain landscape at golden hour, dramatic clouds', enqueue_time: '2023-06-15T09:40:00Z', event: { width: 1344, height: 896, batchSize: 2 } },
  { id: 'fff66666', prompt: 'Vintage Japanese woodblock print, waves and moon', enqueue_time: '2023-06-15T09:35:00Z', event: { width: 1024, height: 1024, batchSize: 4 } },
]
function jobImageUrl(job, index) {
  var seed = job.id.slice(0, 8) + index
  var w = 400
  return 'https://picsum.photos/seed/' + seed + '/' + w + '/' + Math.round(w * job.event.height / job.event.width)
}

function colsF(containerSizeY, containerSizeX, ar, count) {
  var maxTotalSizeY = containerSizeY > containerSizeX ? containerSizeY * 3/4 : containerSizeY / 2
  var maxTotalSizeX = containerSizeY > containerSizeX ? containerSizeX : containerSizeX * 3/4
  if (count === 1) return { cols: 1, maxTotalSizeX: maxTotalSizeX, maxTotalSizeY: maxTotalSizeY }
  var col1SizeX = fit(ar / count, maxTotalSizeX, maxTotalSizeY)
  var col2SizeX = fit(ar, maxTotalSizeX, maxTotalSizeY)
  var col4SizeX = fit(ar * count, maxTotalSizeX, maxTotalSizeY)
  var col1SizeXY = col1SizeX * col1SizeX / ar * count
  var col2SizeXY = col2SizeX * col2SizeX / ar
  var col4SizeXY = col4SizeX * col4SizeX / ar / count
  var cols = col1SizeXY > col2SizeXY ? (col1SizeXY > col4SizeXY ? 1 : count) : (col2SizeXY > col4SizeXY ? 2 : count)
  return { cols: cols, maxTotalSizeX: maxTotalSizeX, maxTotalSizeY: maxTotalSizeY }
}

// === DOM setup
var parentContainer = document.getElementById('container')
var useTouch = 'ontouchstart' in document.documentElement

var dummyPlaceholder = document.createElement('div')
dummyPlaceholder.style.cssText = 'position:absolute;width:1px;'

var composer = document.createElement('div')
composer.className = 'composer'

var chevron = document.createElement('button')
chevron.className = 'chevron'
chevron.style.marginLeft = chevronGapLeft + 'px'
chevron.style.width = chevron.style.height = chevronSize + 'px'
chevron.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="rgb(255, 246, 240)" aria-hidden="true" height="20" width="16"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path></svg>'

var input = document.createElement('input')
input.className = 'input'
input.placeholder = 'Imagine anything\u2026'

var inputForm = document.createElement('form')
inputForm.style.display = 'flex'
inputForm.style.flex = '1'
inputForm.appendChild(input)

var container = document.createElement('div')
container.className = 'container_'

composer.append(chevron, inputForm)
container.append(dummyPlaceholder)
parentContainer.append(composer, container)

// === state
var animatedUntilTime = null
var containerSizeX = parentContainer.clientWidth
var prevScrollTop = 0
var prevInnerSizeY = null
var inputs = { key: null, pointer: [] }
var prevInputs = []
var touchDown = null

var view = { type: 'regular' } // 'regular' | 'collapsed' | 'lightbox'
var anchorRow = null
var data = [] // { job, ar, header, headerSizeY, headerX, headerY, nodes: [{ x, y, sizeY, rotation, node }] }

var firstRender = true

// create data from fakeJobs
function initData() {
  for (var i = 0; i < fakeJobs.length; i++) {
    var job = fakeJobs[i]
    var header = document.createElement('div')
    header.className = 'header'
    header.style.width = containerSizeX + 'px'
    header.innerText = job.prompt
    container.appendChild(header)

    var nodes = []
    for (var j = 0; j < job.event.batchSize; j++) {
      var node = document.createElement('div')
      node.className = 'image'
      node.style.backgroundImage = 'url(' + jobImageUrl(job, j) + ')'
      var img = document.createElement('img')
      node.append(img)
      nodes.push({ x: spring(NaN), y: spring(NaN), sizeY: spring(NaN), rotation: spring(0), node: node })
    }

    data.push({
      job: job,
      ar: job.event.width / job.event.height,
      header: header,
      headerSizeY: header.getBoundingClientRect().height,
      headerX: spring(0),
      headerY: spring(NaN),
      nodes: nodes,
    })
  }
  anchorRow = data.length - 1
}
initData()

function springForEach(data, f) {
  for (var i = 0; i < data.length; i++) {
    f(data[i].headerX); f(data[i].headerY)
    for (var j = 0; j < data[i].nodes.length; j++) {
      f(data[i].nodes[j].sizeY); f(data[i].nodes[j].x); f(data[i].nodes[j].y); f(data[i].nodes[j].rotation)
    }
  }
}

function prevFocus(data, current) {
  if (current.count > 0) return { type: 'lightbox', row: current.row, count: current.count - 1, savedScrollTop: current.savedScrollTop }
  if (current.row === 0) return null
  return { type: 'lightbox', row: current.row - 1, count: data[current.row - 1].nodes.length - 1, savedScrollTop: current.savedScrollTop }
}
function nextFocus(data, current) {
  if (current.count < data[current.row].nodes.length - 1) return { type: 'lightbox', row: current.row, count: current.count + 1, savedScrollTop: current.savedScrollTop }
  if (current.row === data.length - 1) return null
  return { type: 'lightbox', row: current.row + 1, count: 0, savedScrollTop: current.savedScrollTop }
}

// === events
window.addEventListener('resize', scheduleRender)
window.addEventListener('scroll', scheduleRender, true)
window.addEventListener('focus', scheduleRender, true)
window.addEventListener('blur', scheduleRender, true)
window.addEventListener('input', scheduleRender)
window.addEventListener('keydown', function(e) {
  if (e.code === 'Escape' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') { inputs.key = e.code; scheduleRender() }
})
inputForm.addEventListener('submit', function(e) { e.preventDefault() })
if (useTouch) {
  window.addEventListener('touchstart', function(e) { var t = e.touches[0]; inputs.pointer.push({ state: 'down', x: t.pageX, y: t.pageY, target: e.target, time: performance.now() }); scheduleRender() })
  window.addEventListener('touchmove', function(e) { var t = e.touches[0]; inputs.pointer.push({ state: 'move', x: t.pageX, y: t.pageY, target: e.target, time: performance.now() }); scheduleRender() })
  window.addEventListener('pointerup', function(e) { inputs.pointer.push({ state: 'up', x: e.pageX, y: e.pageY, target: e.target, time: performance.now() }); scheduleRender() })
} else {
  window.addEventListener('mousemove', function(e) { inputs.pointer.push({ state: 'move', x: e.pageX, y: e.pageY, target: e.target, time: performance.now() }); scheduleRender() })
  window.addEventListener('click', function(e) { inputs.pointer.push({ state: 'up', x: e.pageX, y: e.pageY, target: e.target, time: performance.now() }); scheduleRender() })
}

// === hit testing
function hitTestChevron(px, py, composerX, composerY, containerSizeY, composerSizeY) {
  var lx = px - composerX, ly = py - composerY
  return insideInclusive(lx, ly, 0, containerSizeY, chevronGapLeft + chevronSize, composerSizeY)
}
function hitTestRegular(data, px, py, containerX, containerY, scrollTop) {
  var lx = px - containerX, ly = py - containerY + scrollTop
  for (var i = 0; i < data.length; i++) {
    for (var j = 0; j < data[i].nodes.length; j++) {
      var n = data[i].nodes[j]
      if (insideInclusive(lx, ly, n.x.dest, n.y.dest, n.sizeY.dest * data[i].ar, n.sizeY.dest))
        return { type: 'lightbox', row: i, count: j, savedScrollTop: scrollTop }
    }
  }
  return null
}
function hitTestLightbox(data, focused, pointerX, containerX) {
  var px = pointerX - containerX
  for (var i = 0; i < data.length; i++) {
    for (var j = 0; j < data[i].nodes.length; j++) {
      var n = data[i].nodes[j]
      if (lessEqual(n.x.dest, px, n.x.dest + n.sizeY.dest * data[i].ar)) {
        if (i === focused.row && j === focused.count) return null
        return { type: 'lightbox', row: i, count: j, savedScrollTop: focused.savedScrollTop }
      }
    }
  }
  return null
}
function hitTestCollapsed(data, px, py, containerX, containerY, scrollTop) {
  var lx = px - containerX, ly = py - containerY + scrollTop
  for (var i = 0; i < data.length; i++) {
    for (var j = 0; j < data[i].nodes.length; j++) {
      var n = data[i].nodes[j]
      if (insideInclusive(lx, ly, n.x.dest, n.y.dest, n.sizeY.dest * data[i].ar, n.sizeY.dest))
        return { type: 'lightbox', row: i, count: j, savedScrollTop: scrollTop }
    }
  }
  return null
}

// === main render loop
function render(now) {
  var parentRect = parentContainer.getBoundingClientRect()
  var newContainerSizeX = parentRect.width
  var windowSizeY = document.documentElement.clientHeight
  var innerSizeY = window.innerHeight
  var inputFocused = document.activeElement === input
  var composerGapBottom = window.navigator.standalone && !inputFocused ? 21 : 0
  var composerSizeY = 56 + composerGapBottom
  var containerX = parentRect.left, containerY = parentRect.top
  var composerX = parentRect.left, composerY = containerY
  var containerSizeY_ = windowSizeY - composerSizeY
  var currentScrollTop = container.scrollTop
  var newAdjustedScrollTop = currentScrollTop
  var newView = view
  var inputShouldBlur = false

  // keys
  if (inputFocused) {
    if (inputs.key === 'Escape') inputShouldBlur = true
  } else {
    if (view.type === 'regular') {
      if (inputs.key === 'Escape') newView = { type: 'collapsed', savedScrollTop: currentScrollTop }
      else if (inputs.key === 'ArrowLeft' || inputs.key === 'ArrowRight') newView = { type: 'lightbox', row: 0, count: 0, savedScrollTop: currentScrollTop }
    } else if (view.type === 'collapsed') {
      if (inputs.key === 'ArrowLeft' || inputs.key === 'ArrowRight') newView = { type: 'lightbox', row: 0, count: 0, savedScrollTop: currentScrollTop }
    } else {
      if (inputs.key === 'Escape') newView = { type: 'regular' }
      else if (inputs.key === 'ArrowLeft') { var p = prevFocus(data, view); newView = p || view }
      else if (inputs.key === 'ArrowRight') { var n = nextFocus(data, view); newView = n || view }
    }
  }

  // process pointer
  var pointer = inputs.pointer
  pointer.sort(function(a, b) { return (a.state === 'up' ? -1 : a.state === 'down' ? 0 : 1) - (b.state === 'up' ? -1 : b.state === 'down' ? 0 : 1) })
  var processedInput, newTouchDown = touchDown, inputToAddToPrevInputs = null

  if (useTouch) {
    if (pointer.length === 0) {
      if (!touchDown) processedInput = { state: 'touchnothing' }
      else { var pp = prevInputs[prevInputs.length - 1]; processedInput = { state: 'touchdrag', x: pp.x, y: pp.y, deltaX: pp.x - touchDown.x, deltaY: pp.y - touchDown.y, time: pp.time } }
    } else {
      var p = pointer[0]
      inputToAddToPrevInputs = { x: p.x, y: p.y, time: p.time }
      if (p.state === 'up') {
        var td = touchDown
        var ii = prevInputs.length - 1; while (ii > 0 && prevInputs[ii].time > td.time && p.time - prevInputs[ii].time <= 40) ii--
        var pLast = prevInputs[prevInputs.length - 1], pI = prevInputs[ii]
        var dt = p.time - pI.time
        processedInput = { state: 'touchend', x: p.x, y: p.y, deltaX: p.x - td.x, deltaY: p.y - td.y, time: p.time, target: p.target, deltaVX: (pLast.x - pI.x) / dt * 1000, deltaVY: (pLast.y - pI.y) / dt * 1000 }
        newTouchDown = null
      } else if (p.state === 'down') {
        processedInput = { state: 'touchstart', x: p.x, y: p.y, time: p.time }
        newTouchDown = { x: p.x, y: p.y, time: p.time, scrollLock: 'none' }
      } else {
        var td = touchDown
        processedInput = { state: 'touchdrag', x: p.x, y: p.y, deltaX: p.x - td.x, deltaY: p.y - td.y, time: p.time }
        if (td.scrollLock === 'none') {
          var dx = p.x - td.x, dy = p.y - td.y
          newTouchDown = Math.abs(dx) * 1.7 > Math.abs(dy) ? { x: td.x, y: td.y, time: td.time, scrollLock: 'x' } : { x: td.x, y: td.y, time: td.time, scrollLock: 'y' }
        }
      }
    }
  } else {
    if (pointer.length === 0) {
      processedInput = prevInputs.length === 0 ? { state: 'mouseNotInitialized' } : { state: 'mouseDownOrHovering', x: prevInputs[prevInputs.length - 1].x, y: prevInputs[prevInputs.length - 1].y }
    } else {
      var p = pointer[0]
      inputToAddToPrevInputs = { x: p.x, y: p.y, time: p.time }
      processedInput = p.state === 'up' ? { state: 'mouseClick', x: p.x, y: p.y, target: p.target } : { state: 'mouseDownOrHovering', x: p.x, y: p.y }
    }
  }

  // view transitions from input
  if (newView.type === 'regular') {
    if (processedInput.state === 'mouseClick' || processedInput.state === 'touchend') {
      if (processedInput.target === input) { /* noop */ }
      else if (hitTestChevron(processedInput.x, processedInput.y, composerX, composerY, containerSizeY_, composerSizeY))
        newView = { type: 'collapsed', savedScrollTop: currentScrollTop }
      else {
        var h = hitTestRegular(data, processedInput.x, processedInput.y, containerX, containerY, currentScrollTop)
        if (h) newView = h
      }
    }
  } else if (newView.type === 'collapsed') {
    if (processedInput.state === 'mouseClick' || processedInput.state === 'touchend') {
      if (processedInput.target === input) { /* noop */ }
      else if (hitTestChevron(processedInput.x, processedInput.y, composerX, composerY, containerSizeY_, composerSizeY)) {
        newAdjustedScrollTop = newView.savedScrollTop
        newView = { type: 'regular' }
      } else {
        var ss = view.type === 'lightbox' ? view.savedScrollTop : currentScrollTop
        var h = hitTestCollapsed(data, processedInput.x, processedInput.y, containerX, containerY, ss)
        if (h) newView = h
      }
    }
  } else if (newView.type === 'lightbox') {
    if (processedInput.state === 'mouseClick') {
      if (processedInput.target === input) { /* noop */ }
      else if (hitTestChevron(processedInput.x, processedInput.y, composerX, composerY, containerSizeY_, composerSizeY)) {
        var ss = view.type === 'lightbox' ? view.savedScrollTop : currentScrollTop
        newView = { type: 'collapsed', savedScrollTop: ss }
      } else {
        var h = hitTestLightbox(data, newView, processedInput.x, containerX)
        newView = h || { type: 'regular' }
      }
    } else if (processedInput.state === 'touchend') {
      if (processedInput.target === input) { /* noop */ }
      else if (hitTestChevron(processedInput.x, processedInput.y, composerX, composerY, containerSizeY_, composerSizeY)) {
        var ss = view.type === 'lightbox' ? view.savedScrollTop : currentScrollTop
        newView = { type: 'collapsed', savedScrollTop: ss }
      } else {
        var td = touchDown
        if (td.scrollLock === 'x') {
          if (processedInput.deltaX > 50) { var pf = prevFocus(data, newView); if (pf) newView = pf }
          else if (processedInput.deltaX < -50) { var nf = nextFocus(data, newView); if (nf) newView = nf }
        } else if (td.scrollLock === 'y') {
          if (Math.abs(processedInput.deltaY) > 50) newView = { type: 'regular' }
        }
      }
    }
  }

  inputShouldBlur = inputShouldBlur || (prevInnerSizeY != null && innerSizeY > prevInnerSizeY)

  // === layout
  var containerGapTop = 0
  var regularImagesSizeY = [], rowsTop = [containerGapTop + headerGapTop]
  for (var i = 0; i < data.length; i++) {
    var d = data[i]
    var cf = colsF(containerSizeY_, newContainerSizeX, d.ar, d.nodes.length)
    var rows = d.nodes.length / cf.cols
    var sizeX = fit(d.ar, (cf.maxTotalSizeX - (cf.cols + 1) * regularImagesGap) / cf.cols, (cf.maxTotalSizeY - (rows - 1) * regularImagesGap) / rows)
    regularImagesSizeY.push(sizeX / d.ar)
    rowsTop.push(rowsTop[rowsTop.length - 1] + headerGapBottom + d.headerSizeY + (sizeX / d.ar) * rows + regularImagesGap * (rows - 1) + headerGapTop)
  }

  var cursor = 'auto'
  var hoverDelta = 4
  var newAnchorRow = anchorRow

  if (newView.type === 'regular') {
