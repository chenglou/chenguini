<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Right-Aligned Dynamic Rectangles</title>
  <style>
    #container {
      position: relative;
      width: 250px;
      height: 2000px;
      margin: 0 auto;
    }

    .rectangle {
      position: absolute;
      right: 0;
      width: 100px;
      height: 100px;
      background-color: lightblue;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
    <div class="rectangle"></div>
  </div>

  <script>
    const container = document.getElementById('container');
    const rectangles = document.querySelectorAll('.rectangle');
    const h = 100; // Initial height in pixels
    const w = 100; // Initial width in pixels
    const m = 10;  // Margin between rectangles in pixels
    const k = 1;   // Scaling factor
    const sigma = h; // Gaussian kernel spread

    // Set initial positions and sizes
    rectangles.forEach((rect, i) => {
      rect.style.top = `${i * (h + m)}px`;
      rect.style.width = `${w}px`;
      rect.style.height = `${h}px`;
    });

    container.addEventListener('mousemove', (event) => {
      const rect = container.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;

      let weights = [];
      let sumWeights = 0;
      rectangles.forEach((rect, i) => {
        const initialTop = i * (h + m);
        const yCenter = initialTop + h / 2;
        const d = Math.abs(yCenter - mouseY);
        const w = Math.exp(- (d * d) / (sigma * sigma));
        weights.push(w);
        sumWeights += w;
      });

      const p = weights.map(w => w / sumWeights);

      let currentTop = 0;
      rectangles.forEach((rect, i) => {
        const scale = 1 + k * p[i];
        const scaledWidth = w * scale;
        const scaledHeight = h * scale;
        rect.style.width = `${scaledWidth}px`;
        rect.style.height = `${scaledHeight}px`;
        rect.style.top = `${currentTop}px`;
        currentTop += scaledHeight + m;
      });
    });

    container.addEventListener('mouseout', () => {
      rectangles.forEach((rect, i) => {
        rect.style.width = `${w}px`;
        rect.style.height = `${h}px`;
        rect.style.top = `${i * (h + m)}px`;
      });
    });
  </script>
</body>
</html>
