<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Global Illumination - Fast Approx</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { position: fixed; top: 0; left: 0; z-index: 0; }
  #grid { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
  #grid img {
    position: absolute;
    object-fit: cover;
    border-radius: 8px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="grid"></div>
<script src="./index.ts" type="module"></script>
</body>
</html>
