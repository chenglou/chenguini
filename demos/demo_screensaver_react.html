<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screensaver (React + Predictive Keyframes)</title>
  <style>
    body { margin: 0; overflow: hidden; }
    .box:hover { filter: brightness(0.9); }
  </style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
'use strict'

const { useEffect, useRef, useState } = React

// === midui helpers (from midui.ts) ===

const msPerAnimationStep = 6

function fract(x) { return x - Math.floor(x) }

function hash11(p) {
  p = fract(p * 0.1031)
  p *= p + 33.33
  p *= p + p
  return fract(p)
}

function hash21(p) {
  const p3x = fract(p * 0.1031)
  const p3y = fract(p * 0.103)
  const p3z = fract(p * 0.0973)
  const dot = p3x * (p3y + 33.33) + p3y * (p3z + 33.33) + p3z * (p3x + 33.33)
  const px = p3x + dot, py = p3y + dot, pz = p3z + dot
  return { x: fract((px + py) * pz), y: fract((px + pz) * py) }
}

function length(x, y) { return Math.sqrt(x * x + y * y) }

function remap(value, oldMin, oldMax, newMin, newMax) {
  if (oldMin === oldMax) return (newMin + newMax) / 2
  return ((value - oldMin) / (oldMax - oldMin)) * (newMax - newMin) + newMin
}

function overlap(a, b) {
  const left = Math.max(a.x, b.x), right = Math.min(a.z, b.z)
  const top = Math.max(a.y, b.y), bottom = Math.min(a.w, b.w)
  if (right > left && bottom > top) return (right - left) * (bottom - top)
  return 0
}

function spring(pos, dest, v = 0, k = 130, b = 21) {
  return { pos, dest, v, k, b }
}

function springStep(s) {
  const t = msPerAnimationStep / 1000
  const Fspring = -s.k * (s.pos - s.dest)
  const Fdamper = -s.b * s.v
  const a = Fspring + Fdamper
  s.v += a * t
  s.pos += s.v * t
}

function springGoToEnd(s) { s.pos = s.dest; s.v = 0 }
function springMostlyDone(s) { return Math.abs(s.v) < 0.01 && Math.abs(s.dest - s.pos) < 0.01 }

// === images ===

const images = []
let nextSeed = 0

function generateImageData(count) {
  const batch = []
  for (let i = 0; i < count; i++) {
    const s = nextSeed++
    const w = 300 + Math.floor(hash11(s + 0.1) * 300)
    const h = 300 + Math.floor(hash11(s + 0.5) * 300)
    batch.push({
      width: w, height: h,
      url: `https://picsum.photos/seed/${s * 7 + 42}/${w}/${h}`,
      aesthetic_score: hash11(s) > 0.95 ? 1 : 0,
    })
  }
  return batch
}

let preloading = false
function scheduleFetch() {
  if (preloading) return
  preloading = true
  const batch = generateImageData(30)
  let next = 0
  function preloadOne() {
    if (next >= batch.length) { preloading = false; return }
    const data = batch[next++]
    const img = new Image()
    img.onload = () => {
      img.decode()
        .then(() => { images.push(data); preloadOne() })
        .catch(() => { images.push(data); preloadOne() })
    }
    img.onerror = () => preloadOne()
    img.src = data.url
  }
  for (let i = 0; i < 5; i++) preloadOne()
}

// === simulation ===

function boxHeight(width, job) { return width / (job.width / job.height) }

function cloneBox(box) {
  return { ...box, opacitySpring: { ...box.opacitySpring }, scaleSpring: { ...box.scaleSpring } }
}

function calculateRepulsion(self, other, containerWH) {
  const sw = self.width * self.scaleSpring.pos
  const sh = boxHeight(sw, self.job)
  const ow = other.width * other.scaleSpring.pos
  const oh = boxHeight(ow, other.job)

  const ov = overlap(
    { x: self.centerX - sw / 2, y: self.centerY - sh / 2, z: self.centerX + sw / 2, w: self.centerY + sh / 2 },
    { x: other.centerX - ow / 2, y: other.centerY - oh / 2, z: other.centerX + ow / 2, w: other.centerY + oh / 2 },
  )

  const dx = self.centerX - other.centerX
  const dy = self.centerY - other.centerY
  const dist = length(dx, dy)
  if (dist === 0) return { x: 0, y: 0 }

  const skew = (containerWH.x / containerWH.y) * 0.8
  const force = remap(ov, 0, sw * sh, 0, 15 * self.enterProgress)
  return { x: (dx / dist) * force * skew, y: (dy / dist) * force }
}

function minEdgeDistPct(box, containerWH) {
  const sw = box.width * box.scaleSpring.pos
  const sh = boxHeight(sw, box.job)
  return Math.min(
    (box.centerX - sw / 2) / containerWH.x,
    (containerWH.x - (box.centerX + sw / 2)) / containerWH.x,
    (box.centerY - sh / 2) / containerWH.y,
    (containerWH.y - (box.centerY + sh / 2)) / containerWH.y,
  )
}

let world = { nextImageIndex: 0, boxes: [], nextBoxCountdown: 0 }

function simulate(w, containerWH) {
  const nw = {
    nextImageIndex: w.nextImageIndex,
    boxes: w.boxes.map(cloneBox),
    nextBoxCountdown: Math.max(0, w.nextBoxCountdown - msPerAnimationStep),
  }

  if (nw.nextImageIndex < images.length && nw.nextBoxCountdown === 0) {
    const job = images[nw.nextImageIndex]
    const ar = job.width / job.height
    const targetArea = (containerWH.x * containerWH.y) / (job.aesthetic_score > 0 ? 7 : 12)
    const bw = Math.sqrt(targetArea * ar)
    const nudge = hash21(nw.nextImageIndex)

    nw.boxes.push({
      job, id: nw.nextImageIndex, width: bw,
      centerX: containerWH.x / 2 + nudge.x,
      centerY: containerWH.y / 2 + nudge.y,
      vx: 0, vy: 0,
      opacitySpring: spring(1, 1, 0, 130, 21),
      scaleSpring: spring(0, 1, 0, 130, 21),
      enterProgress: 0, exiting: false,
    })
    nw.nextImageIndex++
    const r = hash11(nw.nextImageIndex)
    nw.nextBoxCountdown = job.aesthetic_score > 0 ? 2500 + r * 1000 : 200 + r * 1300
  }

  const forces = nw.boxes.map(box => {
    let fx = 0, fy = 0
    for (const other of nw.boxes) {
      if (box !== other) {
        const f = calculateRepulsion(box, other, containerWH)
        fx += f.x; fy += f.y
      }
    }
    return { fx, fy }
  })

  nw.boxes.forEach((box, i) => {
    box.vx += forces[i].fx
    box.vy += forces[i].fy
    box.centerX += box.vx
    box.centerY += box.vy
    box.vx *= 0.2
    box.vy *= 0.2

    const minDist = minEdgeDistPct(box, containerWH)
    box.scaleSpring.dest = 1 - Math.pow(0.9 - Math.max(0, minDist), 10)
    springStep(box.opacitySpring)
    springStep(box.scaleSpring)
    if (springMostlyDone(box.opacitySpring)) springGoToEnd(box.opacitySpring)
    if (springMostlyDone(box.scaleSpring)) springGoToEnd(box.scaleSpring)
    box.enterProgress = Math.min(1, box.enterProgress + msPerAnimationStep / 1000)

    if (!box.exiting && minDist <= 0.05) {
      box.exiting = true
      box.opacitySpring.dest = 0
    }
  })

  nw.boxes = nw.boxes.filter(box => !(box.exiting && box.opacitySpring.pos === 0))
  return nw
}

// === keyframes ===

function boxStyle(box) {
  return {
    display: 'block',
    transform: `translate3d(${box.centerX - box.width / 2}px, ${box.centerY - boxHeight(box.width, box.job) / 2}px, 0) scale(${box.scaleSpring.pos})`,
    opacity: box.opacitySpring.pos,
    boxShadow: box.job.aesthetic_score > 0
      ? `0 0 8px 4px rgba(255, 165, 0, 1), 0 0 40px 12px rgba(255, 165, 0, ${box.opacitySpring.pos * 0.6})`
      : '0 4px 20px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.1)',
  }
}

function animationConfig(kf) {
  return {
    duration: msPerAnimationStep * (kf.length - 1),
    easing: `steps(${kf.length - 1}, end)`,
    fill: 'forwards',
  }
}

function addKeyframes(w, frame, framesMap) {
  const idToBox = new Map(w.boxes.map(b => [b.id, b]))
  framesMap.forEach((entry, id) => {
    const box = idToBox.get(id)
    entry.keyframes.push(box ? boxStyle(box) : { display: 'none' })
  })
  w.boxes.forEach(box => {
    if (!framesMap.has(box.id)) {
      const pad = Array(frame).fill({ display: 'none' })
      pad.push(boxStyle(box))
      framesMap.set(box.id, { box, animation: null, keyframes: pad })
    }
  })
}

// === component ===

function Screensaver() {
  const lastFrameTimeRef = useRef(0)
  const boxesFramesRef = useRef(new Map())
  const [_, forceUpdate] = useState({})
  const rafId = useRef(null)
  const timeoutId = useRef(null)

  useEffect(() => {
    scheduleFetch()
    return () => {
      for (const bf of boxesFramesRef.current.values()) {
        if (bf.animation) bf.animation.cancel()
      }
      if (rafId.current != null) cancelAnimationFrame(rafId.current)
      if (timeoutId.current != null) clearTimeout(timeoutId.current)
    }
  }, [])

  const now = document.timeline.currentTime ?? 0
  const containerWH = { x: document.documentElement.clientWidth, y: document.documentElement.clientHeight }

  // cancel previous animations
  for (const bf of boxesFramesRef.current.values()) {
    if (bf.animation) bf.animation.cancel()
    bf.keyframes = []
  }

  // catch up simulation
  const timeSinceLastFrame = lastFrameTimeRef.current === 0 ? 0 : now - lastFrameTimeRef.current
  lastFrameTimeRef.current = now - (timeSinceLastFrame % msPerAnimationStep)
  const catchUpSteps = Math.floor(timeSinceLastFrame / msPerAnimationStep)
  for (let i = 0; i < catchUpSteps; i++) {
    world = simulate(world, containerWH)
  }

  // build predictive keyframes
  const newBoxesFrames = new Map()
  const predictiveFrameCount = Math.ceil(1200 / msPerAnimationStep)
  let predicted = world
  for (let i = 0; i <= predictiveFrameCount; i++) {
    addKeyframes(predicted, i, newBoxesFrames)
    predicted = simulate(predicted, containerWH)
  }

  // fetch next batch if running low
  if (world.nextImageIndex > images.length - 20) scheduleFetch()

  boxesFramesRef.current = newBoxesFrames

  // schedule next render with 300ms delay so predictive keyframes bridge the gap
  if (rafId.current == null && timeoutId.current == null) {
    timeoutId.current = setTimeout(() => {
      timeoutId.current = null
      rafId.current = requestAnimationFrame(() => {
        rafId.current = null
        forceUpdate({})
      })
    }, 300)
  }

  return (
    <div style={{
      position: 'relative',
      overflow: 'clip',
      width: '100vw',
      height: '100vh',
      background: 'radial-gradient(circle at center, hsl(210, 50%, 24%), hsl(210, 50%, 4%))',
    }}>
      {Array.from(newBoxesFrames.values()).map(({ box }) => (
        <div
          key={box.id}
          className="box"
          ref={el => {
            if (el) {
              const entry = boxesFramesRef.current.get(box.id)
              if (entry) entry.animation = el.animate(entry.keyframes, animationConfig(entry.keyframes))
            }
          }}
          style={{
            position: 'absolute',
            maxWidth: 'none',
            willChange: 'transform',
            transformOrigin: 'center',
            borderRadius: '8px',
            backgroundSize: 'contain',
            backgroundRepeat: 'no-repeat',
            width: box.width,
            height: boxHeight(box.width, box.job),
            backgroundImage: `url(${box.job.url})`,
          }}
        />
      ))}
      {images.length === 0 && (
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: '#d1d5db', fontSize: '1.25rem',
        }}>
          Loading images...
        </div>
      )}
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<Screensaver />)
</script>
</body>
