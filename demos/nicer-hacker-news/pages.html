  <script>
    let currentShownIndex = 1
    let cards = ['tim', 'steve', 'mac', 'jon', 'blow', 'apple']
    let pagesTopCurrent = cards.map(_ => 0)

    document.body.style.margin = 0

    function hash(n) {
      n = (n * 0.1031) % 1;
      n *= n + 33.33;
      n *= n + n;
      return n % 1;
    }

    function makePage() {
      let page = document.createElement('div')
      page.style.position = 'absolute'
      page.style.borderRadius = '12px'
      // page.style.opacity = 0.8
      page.style.boxShadow = 'rgba(0, 0, 0, 0.1) 0 0 8px 4px'
      page.style.fontSize = 40
      page.style.color = 'white'
      page.style.fontFamily = '-apple-system'
      page.style.display = 'flex'
      page.style.justifyContent = 'center'
      page.style.userSelect = page.style.webkitUserSelect = 'none'

      return page
    }

    window.addEventListener('mousedown', () => {
      currentShownIndex = (currentShownIndex + 1 + cards.length) % cards.length
    })

    let container = document.createElement('div')
    document.body.append(container)

    function render() {
      let pagesPosFinal = []
      let {innerWidth, innerHeight} = window
      innerHeight -= 300
      let pageHeightNatural = innerHeight - 100
      let pageWidthNatural = 500

      container.textContent = ''
      for (let i = 0; i < cards.length; i++) {
        let pageTopFinal
        if (i > currentShownIndex) {
          // pageTopFinal = innerHeight - 160 + 80 * (i - currentShownIndex)
          pageTopFinal = innerHeight - 160 + 80 * Math.log(i - currentShownIndex)
        } else if (i === currentShownIndex) {
          pageTopFinal = 50
        } else { // i < currentShownIndex
          // pageTopFinal = 50 - (currentShownIndex - i) * 50
          // pageTopFinal = 50 * (i - currentShownIndex + 1)
          pageTopFinal = -50 * Math.log(currentShownIndex - i)
        }
        pageTopFinal += 100 // debug top padding
        pagesTopCurrent[i] += (pageTopFinal - pagesTopCurrent[i]) / 4
        let pageWidth = pageWidthNatural + (pagesTopCurrent[i] * 0.6 - innerHeight * 0.1) * 0.1
        let page = makePage()
            page.style.left = (innerWidth - pageWidth) / 2
            page.style.width = pageWidth
            page.style.top = pagesTopCurrent[i]
            page.style.height = pageHeightNatural
            page.innerText = cards[i]
            page.style.backgroundColor = `hsl(${hash(i + 0.1) * 200 + 20}, ${hash(i + 0.1) * 60 + 20}%, ${hash(i + 0.1) * 100}%)`
        container.appendChild(page)
      }

      requestAnimationFrame(render)
    }

    render()
