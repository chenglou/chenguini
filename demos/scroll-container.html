<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            width: 300px;
            height: 200px;
            border: 2px solid #333;
            overflow-y: auto;
            margin: 20px 0;
            padding: 10px;
        }
        .content {
            height: 1000px;
            background: linear-gradient(180deg, #f0f0f0 0%, #d0d0d0 100%);
        }
        .controls {
            margin: 20px 0;
        }
        #scrollPosition {
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container" id="scrollContainer">
        <div class="content"></div>
    </div>
    
    <div id="scrollPosition">scrollTop: 0</div>
    
    <div class="controls">
        <input type="number" id="scrollInput" step="any" placeholder="Enter scroll position">
        <button onclick="scrollToPosition()">Scroll To</button>
    </div>

    <script>
        const container = document.getElementById('scrollContainer');
        const display = document.getElementById('scrollPosition');
        const input = document.getElementById('scrollInput');

        // Update display when scrolling
        container.addEventListener('scroll', () => {
            display.textContent = `scrollTop: ${container.scrollTop}`;
        });

        // Scroll to input value
        function scrollToPosition() {
            const value = parseFloat(input.value);
            if (!isNaN(value)) {
                container.scrollTop = value;
            }
        }

        // Also allow Enter key to trigger scroll
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scrollToPosition();
            }
        });
    </script>
</body>
</html>
