<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draggable Cards</title>
  <style>
    body {
      font: 16px system-ui;
      user-select: none; /* no text selection needed */
      -webkit-user-select: none; /* no text selection needed */
      background-color: #eee;
      overflow: hidden; /* prevent accidentally dragging the viewport on iOS */
      margin: 0;
    }
    .row {
      position: absolute;
      display: grid;
      place-items: center;
      overflow: hidden; /* height might be small during animation */
      transition: box-shadow 0.25s ease-out, opacity 0.25s ease-out;
    }
  </style>
</head>
<body>
<script>
'use strict'

// @cs
// Draggable card reordering demo with spring physics
//
// use: scheduler (rAF, dedup, render(now) returns bool to keep animating)
// use: spring (k=290, b=24, 4ms euler step, framerate-decoupled)
//   spring(pos, v=0, k=290, b=24) -> {pos, dest, v, k, b}
//   springStep mutates config; springGoToEnd snaps to dest
//   convergence: |v|<0.01 && |dest-pos|<0.01
// use: events (batch: mouseup, touchend, mousemove, touchmove, pointerdown)
//   mousemove/touchmove -> push to pointer circular buffer (max 20)
//   pointerdown -> push + set firstDown; mouseup/touchend -> set up
// use: pointer FSM (up | down | firstDown)
//   firstDown transitions to down after each render
//   on up: reset pointer buffer to [{x:0,y:0,time:0}]
//
// layout: 5 cards, rowSizeX=320, windowPaddingTop=50
//   each card: div.row, "Drag Me N", random sizeY in [30,180)
//   color: random hue offset r in [40,80], outline hsl(205,100%,r%), bg hsl(205,100%,r+10%)
//   each has springs: x(centered), y(stacked), scale(1)
//
// drag behavior:
//   firstDown: hit test against dynamic spring positions
//   track deltaX/deltaY from pointer to card origin at grab time
//   dragged card: pos=dest=pointer-delta, restrict horizontal: x + (center-x)/1.5
//   scale dest = 1.1
//   swap with neighbor when pointer crosses neighbor's midpoint (loop both directions)
//   non-dragged cards: x.dest=centered, y.dest=stacked top-down, scale.dest=1
//
// release: velocity from last ~100ms of pointer history -> add to spring v
//   vx = (last.x - old.x) / deltaTime * 1000
//
// render visuals:
//   transform: translate3d(x,y,0) scale(s)
//   dragged: z=len+2, shadow 0px 16px 32px rgba(0,0,0,0.2), opacity 0.7
//   lastDragged: z=len+1 (animating back into place)
//   others: z=index, shadow 0px 1px 2px, opacity 1.0
//   body cursor: grabbing | grab (on hover) | auto
// @/cs

// === generic scheduler
let scheduledRender = false
function scheduleRender() {
  if (scheduledRender) return;
  scheduledRender = true
  requestAnimationFrame(function renderAndMaybeScheduleAnotherRender(now) {
    scheduledRender = false
    if (render(now)) scheduleRender()
  })
}

// === generic spring physics
const msPerAnimationStep = 4
function spring(pos, v = 0, k = 290, b = 24) {
  return {pos, dest: pos, v, k, b}
}
function springStep(config) {
  const t = msPerAnimationStep / 1000
  const {pos, dest, v, k, b} = config
  const Fspring = -k * (pos - dest)
  const Fdamper = -b * v
  const a = Fspring + Fdamper
  const newV = v + a * t
  const newPos = pos + newV * t
  config.pos = newPos; config.v = newV
}
function springGoToEnd(config) {
  config.pos = config.dest
  config.v = 0
}

// === generic helper
function center(containee, container) {
  return (container - containee) / 2
}

// === constant layout metrics
const rowSizeX = 320
const windowPaddingTop = 50

// === state
let animatedUntilTime = null
let dragged = null
let lastDragged = null
/** @type 'down' | 'up' | 'firstDown' */
let pointerState = 'up'
let pointer = [{x: 0, y: 0, time: 0}]
let events = { mouseup: null, touchend: null, mousemove: null, touchmove: null, pointerdown: null }
let data = []; {
  const windowSizeX = document.documentElement.clientWidth
  for (let i = 0; i < 5; i++) {
    let node = document.createElement("div")
    const sizeY = 30 + Math.random() * 150
    node.className = "row"
    node.innerHTML = "Drag Me " + i
    node.style.width = rowSizeX
    node.style.height = sizeY
    const rand = Math.random() * 40 + 40
    node.style.outline = `1px solid hsl(205, 100%, ${rand}%)`
    node.style.backgroundColor = `hsl(205, 100%, ${rand + 10}%)`
    data.push({
      id: i + '',
      sizeY,
      x: spring(center(rowSizeX, windowSizeX)),
      y: spring(0),
      scale: spring(1),
      node: node,
    })
    document.body.appendChild(node)
  }
}
function springForEach(f) {
  for (let d of data) {
    f(d.x); f(d.y); f(d.scale)
  }
}

// === events
window.addEventListener('resize', () => scheduleRender())
window.addEventListener("mouseup", (e) => {events.mouseup = e; scheduleRender()})
window.addEventListener("touchend", (e) => {events.touchend = e; scheduleRender()})
window.addEventListener("mousemove", (e) => {events.mousemove = e; scheduleRender()})
window.addEventListener("touchmove", (e) => {events.touchmove = e; scheduleRender()})
window.addEventListener('pointerdown', (e) => {events.pointerdown = e; scheduleRender()})

// === hit testing
function hitTest(data, pointer) {
  for (let d of data) {
    let {x, y, sizeY} = d
    if (x.pos <= pointer.x && pointer.x < x.pos + rowSizeX && y.pos <= pointer.y && pointer.y < y.pos + sizeY) return d
  }
}

function render(now) {
  // === step 0: process events
  if (events.mouseup || events.touchend) pointerState = 'up'
  if (events.mousemove) pointer.push({x: events.mousemove.pageX, y: events.mousemove.pageY, time: performance.now()})
  if (events.touchmove) pointer.push({x: events.touchmove.touches[0].pageX, y: events.touchmove.touches[0].pageY, time: performance.now()})
  if (events.pointerdown) {
    pointerState = 'firstDown'
    pointer.push({x: events.pointerdown.pageX, y: events.pointerdown.pageY, time: performance.now()})
  }

  // === step 1: batched DOM reads
  const windowSizeX = document.documentElement.clientWidth
  const pointerLast = pointer.at(-1)

  // === step 2: handle inputs-related state change
  let newDragged
  if (pointerState === 'down') newDragged = dragged
  else if (pointerState === 'up') {
    if (dragged != null) {
      let dragIdx = data.findIndex(d => d.id === dragged.id)
      let i = pointer.length - 1; while (i >= 0 && now - pointer[i].time <= 100) i--
      let deltaTime = now - pointer[i].time
      let vx = (pointerLast.x - pointer[i].x) / deltaTime * 1000
      let vy = (pointerLast.y - pointer[i].y) / deltaTime * 1000
      data[dragIdx].x.v += vx
      data[dragIdx].y.v += vy
    }
    newDragged = null
  } else {
    const hit = hitTest(data, pointerLast)
    if (hit) newDragged = {id: hit.id, deltaX: pointerLast.x - hit.x.pos, deltaY: pointerLast.y - hit.y.pos}
  }

  // === step 3: calculate new layout & cursor
  if (newDragged) {
    let dragIdx = data.findIndex(d => d.id === newDragged.id)
    let d = data[dragIdx]
    const x = pointerLast.x - newDragged.deltaX
    const y = pointerLast.y - newDragged.deltaY
    d.x.pos = d.x.dest = x + (center(rowSizeX, windowSizeX) - x) / 1.5
    d.y.pos = d.y.dest = y
    d.scale.dest = 1.1
    while (dragIdx > 0 && pointerLast.y < data[dragIdx - 1].y.dest + data[dragIdx - 1].sizeY / 2) {
      [data[dragIdx], data[dragIdx - 1]] = [data[dragIdx - 1], data[dragIdx]]
      dragIdx--
    }
    while (dragIdx < data.length - 1 && pointerLast.y > data[dragIdx + 1].y.dest + data[dragIdx + 1].sizeY / 2) {
      [data[dragIdx], data[dragIdx + 1]] = [data[dragIdx + 1], data[dragIdx]]
      dragIdx++
    }
  }
  let top = windowPaddingTop
  for (let d of data) {
    if (newDragged && d.id === newDragged.id) {
    } else {
      d.x.dest = center(rowSizeX, windowSizeX)
      d.y.dest = top
      d.scale.dest = 1
    }
    top += d.sizeY
  }
  const cursor =
    newDragged ? 'grabbing'
    : hitTest(data, pointerLast) ? 'grab'
    : 'auto'

  // === step 4: run animation
  let newAnimatedUntilTime = animatedUntilTime ?? now
  const steps = Math.floor((now - newAnimatedUntilTime) / msPerAnimationStep)
  newAnimatedUntilTime += steps * msPerAnimationStep
  let stillAnimating = false
  springForEach(s => {
    for (let i = 0; i < steps; i++) springStep(s)
    if (Math.abs(s.v) < 0.01 && Math.abs(s.dest - s.pos) < 0.01) springGoToEnd(s)
    else stillAnimating = true
  })

  // === step 5: render
  for (let i = 0; i < data.length; i++) {
    let d = data[i], style = d.node.style
    style.transform = `translate3d(${d.x.pos}px,${d.y.pos}px,0) scale(${d.scale.pos})`
    style.zIndex =
      newDragged && d.id === newDragged.id ? data.length + 2
      : lastDragged && d.id === lastDragged.id ? data.length + 1
      : i
    if (newDragged && d.id === newDragged.id) {
      style.boxShadow = "rgba(0, 0, 0, 0.2) 0px 16px 32px 0px"
      style.opacity = 0.7
    } else {
      style.boxShadow = "rgba(0, 0, 0, 0.2) 0px 1px 2px 0px"
      style.opacity = 1.0
    }
  }
  document.body.style.cursor = cursor

  // === step 6: update state & prepare for next frame
  if (pointerState === 'firstDown') pointerState = 'down'
  if (dragged && newDragged == null) lastDragged = dragged
  dragged = newDragged
  animatedUntilTime = stillAnimating ? newAnimatedUntilTime : null
  if (pointerState === 'up') pointer = [{x: 0, y: 0, time: 0}]
  if (pointer.length > 20) pointer.shift()
  events.mouseup = events.touchend = events.mousemove = events.touchmove = events.pointerdown = null

  return stillAnimating
}

scheduleRender()
</script>
</body>
